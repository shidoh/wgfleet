# Builds the self-hosted runner image (stock actions-runner + gcc, make, gh)
# and pushes it to ghcr.io/shidoh/wgfleet-runner:<runner version>. The
# maintainer's self-hosted runner scale set pins that tag. Runs on GitHub-hosted runners:
# it needs Docker, and the image is what our own runners are made of.
name: runner-image
on:
  push:
    branches: [main]
    paths:
      - '.github/runner/Dockerfile'
      - '.github/workflows/runner-image.yml'
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'actions/runner version to base on (e.g. 2.337.0)'
        required: true
        default: '2.337.0'
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the base version
        run: echo "RUNNER_VERSION=${{ github.event.inputs.runner_version || '2.338.2' }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .github/runner
          build-args: RUNNER_VERSION=${{ env.RUNNER_VERSION }}
          push: true
          tags: |
            ghcr.io/shidoh/wgfleet-runner:${{ env.RUNNER_VERSION }}
            ghcr.io/shidoh/wgfleet-runner:latest
