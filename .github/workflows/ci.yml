name: ci

# Fast feedback on every push and pull request: format check, vet, build, test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      # The data-path rehearsal needs CAP_NET_ADMIN: it opens the IP_TRANSPARENT
      # reply socket mihomo opens, which is the one call the August 2026 outage
      # turned on. Unprivileged it skips itself, and a test that always skips is a
      # test nobody has, so it is run deliberately under sudo rather than left to
      # the ordinary suite.
      - name: Data-path rehearsal (privileged)
        run: sudo -E env "PATH=$PATH" go test -count=1 -v ./test/datapath/...
