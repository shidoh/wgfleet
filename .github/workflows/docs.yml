# Publishes the operator documentation as a static site into a separate
# repository (shidoh/wgfleet-docs, branch gh-pages), which serves it on GitHub
# Pages at shidoh.github.io/wgfleet-docs.
#
# Requires one secret: DOCS_DEPLOY_KEY — the private half of a deploy key added
# to shidoh/wgfleet-docs with write access. Only main publishes.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "SECURITY.md"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Build (strict — a broken link fails the job)
        run: make docs-site

      - name: Publish to the docs repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: shidoh/wgfleet-docs
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          commit_message: "docs: ${{ github.sha }}"
