name: release

# Build and publish release binaries when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces ONE self-contained tarball per architecture (linux/amd64 and
# linux/arm64) — statically-linked controller + agent binaries, the installer,
# INSTALL.md and reference configs — plus a SHA256SUMS file, attached to a
# GitHub Release. Can also be run manually (workflow_dispatch) against a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0). Created at HEAD if it does not exist.'
        required: true

permissions:
  contents: write          # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so the build can stamp identity

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve build identity
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Building $TAG @ $(git rev-parse --short HEAD)"

      - name: Build release archives (linux amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            make release-archive \
              ARCH="$arch" \
              VERSION="$TAG" \
              COMMIT="$COMMIT" \
              EXTRA_LDFLAGS="-s -w"
          done
          ls -lh dist/*.tar.gz

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS   # archives only, not the sums file itself

      - name: Generate changelog
        run: |
          # Use the tag ref if it exists (tag push); fall back to HEAD (manual run
          # before the tag is created). RELEASE_TAG keeps the compare link correct.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            CURREF="$TAG"
          else
            CURREF="HEAD"
          fi
          RELEASE_TAG="$TAG" bash .github/release-notes.sh "$CURREF" > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prereleases are tags with a pre-release suffix (e.g. v0.1.0-rc1).
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          # Create the release with all assets, or update notes + assets if it exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              $PRERELEASE \
              dist/*.tar.gz dist/SHA256SUMS
          fi
