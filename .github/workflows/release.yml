name: release

# Build and publish release binaries when a version tag is pushed.
#
#   git tag -a v0.1.0 -m '- **What an operator must not miss.** …'
#   git push origin v0.1.0
#
# The annotated tag's message becomes the "Highlights" section at the top of the
# release notes and the caption of the Telegram announcement; a lightweight tag
# just gets the generated changelog.
#
# Produces ONE self-contained tarball per architecture (linux/amd64 and
# linux/arm64) — statically-linked controller + agent binaries, the installer,
# INSTALL.md and reference configs — plus a SHA256SUMS file, attached to a
# GitHub Release. Can also be run manually (workflow_dispatch) against a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0). Created at HEAD if it does not exist.'
        required: true
      announce:
        description: 'Post the Telegram announcement (set to false when re-running a build for an already announced tag)'
        type: boolean
        default: true

permissions:
  contents: write          # needed to create the release and upload assets

jobs:
  # Build, verify and publish on the maintainer's self-hosted runner scale set
  # (label `sln`). The announcement stays on a GitHub-hosted runner: Telegram is
  # not reachable from there.
  build:
    runs-on: sln
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags so the build can stamp identity
          # Without this, a workflow_dispatch checked out whatever ref the UI was
          # sitting on (usually main) while labelling and publishing the result as
          # the tag typed into the input — verifying and shipping one commit under
          # another commit's name.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          # actions/cache uploads GOMODCACHE to GitHub after the job (~75 s); our
          # runners keep it on a persistent volume, so skip that there.
          cache: ${{ runner.environment != 'self-hosted' }}

      # A tag can sit on a commit CI never saw: ci.yml runs on push-to-main and PRs
      # only, and workflow_dispatch will happily tag HEAD. Publishing binaries that
      # nothing verified — to anyone who installs them — is the one place where a
      # green tree is not optional.
      - name: Build tools (a stock actions-runner image has no make, C compiler or gh; a no-op on our own image)
        if: runner.environment == 'self-hosted'
        run: |
          if ! command -v gcc >/dev/null || ! command -v make >/dev/null || ! command -v gh >/dev/null; then
            sudo mkdir -p -m 755 /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update -q
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q gcc libc6-dev make gh
          fi
          gcc --version | head -1; make --version | head -1; gh --version | head -1
      - name: Verify before publishing
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          go test -race -timeout 10m ./...

      - name: Resolve build identity
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Building $TAG @ $(git rev-parse --short HEAD)"

      - name: Build release archives (linux amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            make release-archive \
              ARCH="$arch" \
              VERSION="$TAG" \
              COMMIT="$COMMIT" \
              EXTRA_LDFLAGS="-s -w"
          done
          ls -lh dist/*.tar.gz

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS   # archives only, not the sums file itself

      - name: Generate changelog
        run: |
          # Use the tag ref if it exists (tag push); fall back to HEAD (manual run
          # before the tag is created). RELEASE_TAG keeps the compare link correct.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            CURREF="$TAG"
          else
            CURREF="HEAD"
          fi
          RELEASE_TAG="$TAG" bash .github/release-notes.sh "$CURREF" > release-notes.md
          echo "----- release notes -----"; cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prereleases are tags with a pre-release suffix (e.g. v0.1.0-rc1).
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          # Create the release with all assets, or update notes + assets if it exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              $PRERELEASE \
              dist/*.tar.gz dist/SHA256SUMS
          fi

      # Announce the release in a Telegram channel: the changelog as a message
      # plus the build archives as attached documents. Skipped for prereleases
      # (tags with a suffix, e.g. v0.1.0-rc1) and when the bot secrets are unset.
      #   Repo secrets required: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
      #   (chat id = @channelusername or the numeric -100… id).

  announce:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') && github.event.inputs.announce != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.inputs.tag || github.ref_name }}" -D dist --pattern '*.tar.gz' --pattern 'SHA256SUMS'
      - name: Announce on Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured — skipping channel announcement."
            exit 0
          fi
          bash .github/telegram-notify.sh "$TAG" dist docs/changelog.md
