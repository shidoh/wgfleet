{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — wgfleet</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">wg<span class="dot">·</span>fleet</span>
    <span class="tagline">control plane</span>
    <span class="spacer"></span>
    <span class="nodecount"><span class="statusdot pulse"></span>{{.NodeCount}} node{{if ne .NodeCount 1}}s{{end}}</span>
    <span class="topbar-account">
      <a class="account-link" href="/profile" title="Admin profile">{{.User}}</a>
      <form method="post" action="/logout" class="logout-form"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="account-link" type="submit">logout</button></form>
    </span>
  </header>
  <main class="shell">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
