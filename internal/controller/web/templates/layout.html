{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — wgfleet</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" title="Fleet overview"><svg class="mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><circle cx="16" cy="32" r="8.5" fill="currentColor"/>
<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><line x1="24" y1="27" x2="33" y2="21"/><line x1="25" y1="32" x2="34" y2="32"/><line x1="24" y1="37" x2="33" y2="43"/></g>
<g fill="currentColor"><circle cx="38" cy="17.5" r="2.4"/><circle cx="43" cy="14" r="2.4"/><circle cx="40" cy="32" r="2.4"/><circle cx="45" cy="32" r="2.4"/><circle cx="38" cy="46.5" r="2.4"/><circle cx="43" cy="50" r="2.4"/></g>
<g fill="#3ddc84"><circle cx="51" cy="10" r="4.5"/><circle cx="54" cy="32" r="4.5"/><circle cx="51" cy="54" r="4.5"/></g></svg><span>wg<span class="dot">·</span>fleet</span></a>
    <span class="tagline">control plane</span>
    <span class="spacer"></span>
    <span class="nodecount"><span class="statusdot pulse"></span>{{.NodeCount}} node{{if ne .NodeCount 1}}s{{end}}</span>
    <span class="topbar-account">
      <a class="account-link" href="/profile" title="Admin profile">{{.User}}</a>
      <form method="post" action="/logout" class="logout-form"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="account-link" type="submit">logout</button></form>
    </span>
  </header>
  <main class="shell">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
