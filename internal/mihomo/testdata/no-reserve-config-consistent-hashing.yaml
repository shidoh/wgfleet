  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT,no-resolve
  - GEOSITE,category-ads-all,REJECT
  - MATCH,wg-best
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  parse-pure-ip: true
  skip-domain:
    - +.themoviedb.org
    - +.cloudfront.net
  sniff:
