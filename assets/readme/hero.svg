54.768 242.44399999999996 51.204Q244.56799999999998 47.64 248.49199999999996 45.66Q252.41599999999997 43.68 257.67199999999997 43.68Q262.928 43.68 266.78 45.66Q270.63199999999995 47.64 272.756 51.204Q274.88 54.768 274.88 59.52V66.864H250.61599999999999V68.88Q250.61599999999999 72.624 252.38 74.352Q254.14399999999998 76.08 257.67199999999997 76.08Q259.976 76.08 261.70399999999995 75.36Q263.43199999999996 74.64 263.71999999999997 73.2H274.304Q273.152 78.384 268.616 81.55199999999999Q264.08 84.72 257.67199999999997 84.72ZM250.61599999999999 59.52V60.456L264.58399999999995 60.312V59.376000000000005Q264.58399999999995 55.704 262.89199999999994 53.688Q261.2 51.672000000000004 257.67199999999997 51.672000000000004Q254.14399999999998 51.672000000000004 252.38 53.760000000000005Q250.61599999999999 55.848 250.61599999999999 59.52Z M302.76 84.0Q296.712 84.0 293.256 80.544Q289.8 77.088 289.8 71.04V54.120000000000005H279.144V44.400000000000006H289.8V33.24H300.59999999999997V44.400000000000006H316.08V54.120000000000005H300.59999999999997V70.68Q300.59999999999997 72.264 301.428 73.27199999999999Q302.256 74.28 303.84 74.28H315.71999999999997V84.0Z" fill="#f1f3f7"/></g></g>
      <circle cx="192" cy="38" r="4" fill="#3ddc84"/>
      <text x="208" y="45" font-size="18" fill="#5a6270">control plane</text>
      <text x="1152" y="45" font-size="18" fill="#5a6270" text-anchor="end">AGPL-3.0 <tspan fill="#2a313d">·</tspan> Go 1.26 <tspan fill="#2a313d">·</tspan> Linux data plane</text>
    </g>
    <rect x="0" y="72" width="1200" height="1" fill="url(#rule)"/>

    <!-- ============ left: the claim ============ -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="48" y="146" font-size="18" font-weight="600" fill="#7a828f" letter-spacing="2.4">AMNEZIAWG EXIT FLEETS</text>

      <text x="48" y="212" font-size="40" font-weight="700" fill="#f1f3f7">Declare the fleet.</text>
      <text x="48" y="262" font-size="40" font-weight="700" fill="#f1f3f7">wgfleet builds it</text>
      <text x="48" y="312" font-size="40" font-weight="700" fill="#f1f3f7">and <tspan fill="#3ddc84">holds it there.</tspan></text>

      <text x="48" y="362" font-size="20" fill="#8b93a1">Blank Ubuntu VM to a <tspan fill="#cdd3dd">Ready</tspan> exit node —</text>
      <text x="48" y="390" font-size="20" fill="#8b93a1">then a reconcile loop keeps it that way.</text>

      <!-- chips -->
      <g>
        <rect x="48" y="416" width="132" height="30" rx="7" fill="rgba(61,220,132,.09)" stroke="rgba(61,220,132,.28)"/>
        <text x="114" y="436" font-size="17" fill="#3ddc84" text-anchor="middle">declarative</text>

        <rect x="190" y="416" width="150" height="30" rx="7" fill="rgba(91,141,239,.10)" stroke="rgba(91,141,239,.35)"/>
        <text x="265" y="436" font-size="17" fill="#5b8def" text-anchor="middle">dry-run first</text>

        <rect x="350" y="416" width="188" height="30" rx="7" fill="#0d1119" stroke="#2a313d"/>
        <text x="444" y="436" font-size="17" fill="#8b93a1" text-anchor="middle">keys stay on node</text>
      </g>
    </g>

    <!-- ============ right: real plan output ============ -->
    <!-- Abridged from a real first run of the agent in once+plan mode (README "Try it
         locally"): the markers, byte/mode summary, redaction and awg-quick wording are
         verbatim; the [Interface] body is cut to the lines that matter. -->
    <g>
      <rect x="612" y="112" width="540" height="330" rx="13" fill="#0c1017" stroke="#1c222c"/>
      <rect x="612" y="112" width="540" height="44" rx="13" fill="#0d1119"/>
      <rect x="612" y="143" width="540" height="13" fill="#0d1119"/>
      <rect x="612" y="155" width="540" height="1" fill="#161b24"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <circle cx="636" cy="134" r="4" fill="#f5b14c"/>
        <text x="652" y="140" font-size="16" fill="#cdd3dd">agent --once --plan <tspan fill="#3a4150">·</tspan> <tspan fill="#8b93a1">exit-de-1</tspan></text>
        <text x="1130" y="140" font-size="15" fill="#5a6270" text-anchor="end">writes nothing</text>

        <g font-size="14.5">
          <text y="190"><tspan x="636" fill="#3ddc84" font-weight="700">+ create</tspan><tspan x="724" fill="#8b93a1">awg0.conf — 2733 bytes, mode 600</tspan></text>
          <text x="660" y="213" fill="#5a6270">| <tspan fill="#8b93a1">[Interface]</tspan></text>
          <text x="660" y="236" fill="#5a6270">| PrivateKey = <tspan fill="#f5b14c">&lt;redacted&gt;</tspan></text>
          <text x="660" y="259" fill="#5a6270">| ListenPort = <tspan fill="#8b93a1">22891</tspan></text>
          <text x="660" y="282" fill="#5a6270">| S1 = <tspan fill="#8b93a1">27</tspan> S2 = <tspan fill="#8b93a1">38</tspan> S3 = <tspan fill="#8b93a1">63</tspan> S4 = <tspan fill="#8b93a1">23</tspan></text>
          <text x="660" y="305" fill="#5a6270">| H1 = <tspan fill="#8b93a1">29838687-159838687</tspan></text>
          <text x="660" y="328" fill="#5a6270">| I1 = <tspan fill="#8b93a1">&lt;b 0x000100002112a442&gt;&lt;r 12&gt;</tspan></text>
          <text y="356"><tspan x="636" fill="#f5b14c" font-weight="700">! exec</tspan><tspan x="724" fill="#8b93a1">awg-quick — bring interface up with new config</tspan></text>
          <text x="660" y="379" fill="#5a6270">| awg-quick up awg0.conf</text>
          <text y="407"><tspan x="636" fill="#3a4150" font-weight="700">no-change</tspan><tspan x="732" fill="#5a6270">reality inbound — disabled</tspan></text>
        </g>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="479" rx="14" fill="none" stroke="#1c222c"/>
  </g>
</svg>
