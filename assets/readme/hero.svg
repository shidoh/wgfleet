<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="wgfleet — a control plane for AmneziaWG exit fleets. Declare the fleet; wgfleet builds it and holds it there. Beside the title, a terminal panel shows real dry-run output from wgfleet-agent --once --plan for node exit-de-1: it would create awg0.conf with PrivateKey redacted and the derived AmneziaWG obfuscation parameters, then run awg-quick to bring the interface up; the REALITY inbound stays disabled — writing nothing.">
  <title>wgfleet — a control plane for AmneziaWG exit fleets</title>
  <defs>
    <radialGradient id="pg" cx="50%" cy="-15%" r="130%">
      <stop offset="0%" stop-color="#11161f"/>
      <stop offset="58%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c222c" stop-opacity="0"/>
      <stop offset="12%" stop-color="#1c222c" stop-opacity="1"/>
      <stop offset="88%" stop-color="#1c222c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1c222c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="480" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="url(#pg)"/>

    <!-- ============ header bar ============ -->
    <!-- No wire-contract number here on purpose: it bumps with every protocol change. -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<!-- Outlined lockup from assets/brand/lockup-dark.svg (mark + wg•fleet); paths, not text, so it renders the same everywhere. -->
      <g transform="translate(48,22) scale(0.2809) translate(12.0,-11.8)"><g transform="translate(0,23.839999999999996) scale(1.29375)"><circle cx="16" cy="32" r="8.5" fill="#f1f3f7"/>
<g fill="none" stroke="#f1f3f7" stroke-width="5" stroke-linecap="round"><line x1="24" y1="27" x2="33" y2="21"/><line x1="25" y1="32" x2="34" y2="32"/><line x1="24" y1="37" x2="33" y2="43"/></g>
<g fill="#f1f3f7"><circle cx="38" cy="17.5" r="2.4"/><circle cx="43" cy="14" r="2.4"/><circle cx="40" cy="32" r="2.4"/><circle cx="45" cy="32" r="2.4"/><circle cx="38" cy="46.5" r="2.4"/><circle cx="43" cy="50" r="2.4"/></g>
