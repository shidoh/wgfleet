<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Node lifecycle. A node moves from Pending, meaning it is in the config but not yet touched, to Provisioning during SSH bootstrap of the blank VM, to Reconciling while it converges to its NodeSpec, to Ready once every self-check passes. From Reconciling or Ready a node drops to Degraded when a self-check fails or the agent goes silent past the staleness window, or to Error when a reconcile pass fails. Both recover back to Ready on the next good pass. Below the states, a strip of flags orthogonal to state, shown under the state pill in the console: drained (from the console, out of the balancer), drained by config (manifest drain: true, edit it to undrain), egress blocked (WARP unreachable, likely an ISP or DPI block), egress: direct (failed over, returns to WARP by itself), low throughput (below the floor, held out of the balancer), decommissioning (data plane torn down, keys destroyed). NOT CARRYING in the topology is a grouping of exits the master is not routing through, not a state.">
  <title>wgfleet node lifecycle — Pending to Provisioning to Reconciling to Ready, plus the flags orthogonal to state</title>
  <defs>
    <radialGradient id="pg" cx="50%" cy="-30%" r="140%">
      <stop offset="0%" stop-color="#11161f"/>
      <stop offset="58%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#3a4150"/>
    </marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#3a3320"/>
    </marker>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="410" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="1200" height="410" fill="url(#pg)"/>

    <text x="40" y="44" font-size="18" font-weight="700" fill="#7a828f" letter-spacing="2.4">NODE LIFECYCLE</text>
    <text x="1160" y="44" font-size="16" fill="#5a6270" text-anchor="end">driven by the agent's own self-checks</text>
    <rect x="40" y="58" width="1120" height="1" fill="#161b24"/>

    <!-- Pending -->
    <rect x="40" y="96" width="176" height="48" rx="9" fill="#0d1119" stroke="#2a313d"/>
    <circle cx="66" cy="120" r="4.5" fill="#5a6270"/>
    <text x="82" y="127" font-size="19" font-weight="600" fill="#8b93a1">Pending</text>
    <text x="128" y="168" font-size="15" fill="#5a6270" text-anchor="middle">in config,</text>
    <text x="128" y="188" font-size="15" fill="#5a6270" text-anchor="middle">not yet touched</text>

    <path d="M226,120 L262,120" stroke="#3a4150" stroke-width="1.6" fill="none" marker-end="url(#am)"/>

    <!-- Provisioning -->
    <rect x="272" y="96" width="200" height="48" rx="9" fill="#0d1119" stroke="#2a313d"/>
    <circle cx="298" cy="120" r="4.5" fill="#8b93a1"/>
    <text x="314" y="127" font-size="19" font-weight="600" fill="#cdd3dd">Provisioning</text>
    <text x="372" y="168" font-size="15" fill="#5a6270" text-anchor="middle">SSH bootstrap</text>
    <text x="372" y="188" font-size="15" fill="#5a6270" text-anchor="middle">of a blank VM</text>

    <path d="M482,120 L518,120" stroke="#3a4150" stroke-width="1.6" fill="none" marker-end="url(#am)"/>

    <!-- Reconciling -->
    <rect x="528" y="96" width="196" height="48" rx="9" fill="rgba(91,141,239,.10)" stroke="rgba(91,141,239,.35)"/>
    <circle cx="554" cy="120" r="4.5" fill="#5b8def"/>
    <text x="570" y="127" font-size="19" font-weight="600" fill="#cfe0ff">Reconciling</text>
    <text x="626" y="168" font-size="15" fill="#5a6270" text-anchor="middle">converging to</text>
    <text x="626" y="188" font-size="15" fill="#5a6270" text-anchor="middle">its NodeSpec</text>

    <path d="M734,120 L770,120" stroke="#3a4150" stroke-width="1.6" fill="none" marker-end="url(#am)"/>

    <!-- Ready -->
    <rect x="780" y="96" width="160" height="48" rx="9" fill="rgba(61,220,132,.12)" stroke="rgba(61,220,132,.30)"/>
    <circle cx="806" cy="120" r="4.5" fill="#3ddc84"/>
    <text x="822" y="127" font-size="19" font-weight="700" fill="#3ddc84">Ready</text>
    <text x="860" y="168" font-size="15" fill="#5a6270" text-anchor="middle">all self-checks pass</text>

    <!-- fault branch -->
    <path d="M950,110 L998,110" stroke="#3a3320" stroke-width="1.6" fill="none" marker-end="url(#aa)"/>
    <path d="M950,130 L998,130" stroke="#3a3320" stroke-width="1.6" fill="none" marker-end="url(#aa)"/>

    <rect x="1008" y="86" width="152" height="40" rx="9" fill="rgba(245,177,76,.08)" stroke="#3a3320"/>
    <circle cx="1030" cy="106" r="4.5" fill="#f5b14c"/>
    <text x="1046" y="112" font-size="17" font-weight="600" fill="#c9b894">Degraded</text>

    <rect x="1008" y="134" width="152" height="40" rx="9" fill="rgba(248,113,113,.07)" stroke="#3a2424"/>
    <circle cx="1030" cy="154" r="4.5" fill="#f87171"/>
    <text x="1046" y="160" font-size="17" font-weight="600" fill="#d98a8a">Error</text>

    <text x="1160" y="206" font-size="15" fill="#5a6270" text-anchor="end">a check fails, or the agent goes silent</text>
    <text x="1160" y="228" font-size="15" fill="#5a6270" text-anchor="end">recovers to Ready on the next good pass</text>

    <!-- ================= FLAGS, orthogonal to state ================= -->
    <!-- The sub-badges the console shows under a node's state pill (nodes.html
         "node-subbadges"). A node keeps its lifecycle state while carrying any of
         them; colours follow the console: amber for operator/auto holds, red for a
         detected block. Chips are sized to their label (~9 px per char at 15 px)
         with 18 px gaps; captions are centred under each chip. -->
    <rect x="40" y="252" width="1120" height="1" fill="#161b24"/>
    <text x="40" y="282" font-size="15" font-weight="700" fill="#7a828f" letter-spacing="2.4">FLAGS · ORTHOGONAL TO STATE</text>
    <text x="1160" y="282" font-size="14" fill="#5a6270" text-anchor="end">shown under the state pill · NOT CARRYING is a topology group, not a state</text>

    <!-- drained (console) -->
    <rect x="40" y="300" width="112" height="34" rx="8" fill="rgba(245,177,76,.06)" stroke="rgba(245,177,76,.30)"/>
    <circle cx="58" cy="317" r="4" fill="#f5b14c"/>
    <text x="70" y="322" font-size="15" fill="#f5b14c">drained</text>
    <text x="96" y="360" font-size="13" fill="#5a6270" text-anchor="middle">console Drain —</text>
    <text x="96" y="380" font-size="13" fill="#5a6270" text-anchor="middle">out of the LB</text>

    <!-- drained by config (manifest drain: true) -->
    <rect x="170" y="300" width="202" height="34" rx="8" fill="rgba(245,177,76,.06)" stroke="rgba(245,177,76,.30)"/>
    <circle cx="188" cy="317" r="4" fill="#f5b14c"/>
    <text x="200" y="322" font-size="15" fill="#f5b14c">drained by config</text>
    <text x="271" y="360" font-size="13" fill="#5a6270" text-anchor="middle">manifest drain: true</text>
    <text x="271" y="380" font-size="13" fill="#5a6270" text-anchor="middle">edit it to undrain</text>

    <!-- egress blocked -->
    <rect x="390" y="300" width="176" height="34" rx="8" fill="rgba(248,113,113,.06)" stroke="rgba(248,113,113,.30)"/>
    <circle cx="408" cy="317" r="4" fill="#f87171"/>
    <text x="420" y="322" font-size="15" fill="#f87171">egress blocked</text>
    <text x="478" y="360" font-size="13" fill="#5a6270" text-anchor="middle">WARP unreachable —</text>
    <text x="478" y="380" font-size="13" fill="#5a6270" text-anchor="middle">likely ISP/DPI block</text>

    <!-- egress: direct (failed over) -->
    <rect x="584" y="300" width="176" height="34" rx="8" fill="rgba(245,177,76,.06)" stroke="rgba(245,177,76,.30)"/>
    <circle cx="602" cy="317" r="4" fill="#f5b14c"/>
    <text x="614" y="322" font-size="15" fill="#f5b14c">egress: direct</text>
    <text x="672" y="360" font-size="13" fill="#5a6270" text-anchor="middle">failed over; returns</text>
    <text x="672" y="380" font-size="13" fill="#5a6270" text-anchor="middle">to WARP by itself</text>

    <!-- low throughput (auto-suspend) -->
    <rect x="778" y="300" width="176" height="34" rx="8" fill="rgba(245,177,76,.06)" stroke="rgba(245,177,76,.30)"/>
    <circle cx="796" cy="317" r="4" fill="#f5b14c"/>
    <text x="808" y="322" font-size="15" fill="#f5b14c">low throughput</text>
    <text x="866" y="360" font-size="13" fill="#5a6270" text-anchor="middle">below the floor —</text>
    <text x="866" y="380" font-size="13" fill="#5a6270" text-anchor="middle">held out of the LB</text>

    <!-- decommissioning -->
    <rect x="972" y="300" width="184" height="34" rx="8" fill="rgba(245,177,76,.06)" stroke="rgba(245,177,76,.30)"/>
    <circle cx="990" cy="317" r="4" fill="#f5b14c"/>
    <text x="1002" y="322" font-size="15" fill="#f5b14c">decommissioning</text>
    <text x="1064" y="360" font-size="13" fill="#5a6270" text-anchor="middle">data plane torn down,</text>
    <text x="1064" y="380" font-size="13" fill="#5a6270" text-anchor="middle">keys destroyed</text>

    <rect x="0.5" y="0.5" width="1199" height="409" rx="14" fill="none" stroke="#1c222c"/>
  </g>
</svg>
