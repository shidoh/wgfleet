syntax = "proto3";

package wgfleet.v1;

option go_package = "github.com/shidoh/wgfleet/internal/api/pb;pb";

// NodeService is the controller↔agent control channel. It runs over mutual TLS:
// the agent's identity (node_id) is taken from its verified client-certificate
// CN, NOT from request fields, so an agent cannot impersonate another node.
service NodeService {
  // Register announces a node to the controller after bootstrap and returns its
  // assigned state. Idempotent — safe to call on every agent start.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // PublishPublicKey registers the node's WireGuard public key. The controller
  // only ever stores public keys (key-broker model); private keys never leave
  // the node.
  rpc PublishPublicKey(PublishPublicKeyRequest) returns (PublishPublicKeyResponse);

  // PullSpec returns the node's desired NodeSpec, rendered by the controller
  // from fleet config + the registry of peer public keys.
  rpc PullSpec(PullSpecRequest) returns (NodeSpec);

  // ReportStatus streams health/status reports from the agent. The server
  // acknowledges once the stream closes.
  rpc ReportStatus(stream StatusReport) returns (ReportStatusAck);
}

message RegisterRequest {
  string role = 1; // "master" | "exit"; cross-checked against inventory
  string public_ip = 2; // discovered public IP for peer endpoints
  string region = 3;
  string mgmt_addr = 4; // node's management/ZT address (admin + metrics bind)
}

message RegisterResponse {
  string node_id = 1; // echoed back (derived from cert CN)
  string state = 2; // current NodeState
}

message PublishPublicKeyRequest {
  string public_key = 1; // base64 public key
  // key_type selects which key registry the value lands in (ADR-0025). Empty ⇒
  // "wireguard" (back-compat: an older agent omits it and publishes its WG key).
  // "reality" publishes the exit's REALITY x25519 public key for the master's
  // vless proxy. Additive — no wire-version bump.
  string key_type = 2;
}

message PublishPublicKeyResponse {
  bool accepted = 1;
}

message PullSpecRequest {
  // Empty: the node is identified by its client certificate.
}

message StatusReport {
  string state = 1; // observed NodeState
  string egress_ip = 2; // observed egress IP (should be Cloudflare for warp)
  string reconcile_error = 3;
  int64 last_handshake_unix = 4; // freshest WG handshake (unix seconds, 0 = none)
  repeated HealthCheck checks = 5;
  repeated ExitTunnelHealth exit_health = 6; // master only: per-exit tunnel health from mihomo
  // client_peers is the master's view of the end users on its client-facing
  // interface, read from the live interface. Additive and observational: an older
  // controller ignores it, and a master that does not own that interface simply
  // sends none — no wire bump needed for either direction.
  repeated ClientPeerStatus client_peers = 7;
}

// ClientPeerStatus is one end user's live peer on the master's client interface,
// keyed by public key: the interface knows nothing about labels, so the
// controller matches these back onto the credentials it issued.
// Deliberately carries NO endpoint: that is the end user's real, pre-tunnel IP,
// and reporting it would persist a connection log fleet-side for a column no
// page displays. Field 2 stays reserved so nobody re-adds it by accident.
message ClientPeerStatus {
  string public_key = 1;
  reserved 2;
  reserved "endpoint";
  int64 last_handshake_unix = 3;  // unix seconds; 0 = never
  int64 received_bytes = 4;
  int64 sent_bytes = 5;
}

message HealthCheck {
  string name = 1;
  bool ok = 2;
  string detail = 3;
  int64 latency_ms = 4;
}

message ExitTunnelHealth {
  string name = 1; // exit node name (== mihomo proxy name)
  bool alive = 2; // mihomo proxy alive
  int64 delay_ms = 3; // last url-test delay (0 = none/failed)
  int64 last_test_unix = 4; // unix seconds of the last delay test (0 = none)
  bool selected = 5; // currently chosen by the wg-best group
}

message ReportStatusAck {
  uint32 received = 1; // number of reports the server processed
}

// ---- Desired-state messages (mirror internal/domain) ----

message NodeSpec {
  string role = 1;
  string egress = 2;
  WGServerSpec wg_server = 3;
  repeated PeerSpec peers = 4;
  DNSFilterSpec dns = 5;
  FirewallSpec firewall = 6;
  RoutingSpec routing = 7;
  ExportersSpec exporters = 8;
  MasterSpec master = 9; // master nodes only (mihomo data plane); unset for exits
  bool decommission = 10; // tear the node down (reverse reconcile) instead of converging
  int32 warp_mtu = 11; // exit warp egress: WARP interface MTU; 0 = compute (1440), set when the real WARP path is smaller (an earlier finding: 1320-1420)
  repeated string egress_chain = 12; // egress priority chain for censorship-adaptive failover (ADR-0017); [0] = preferred (== egress), later = fallbacks; empty ⇒ no failover
  int32 egress_throughput_min_bps = 13; // exit egress throughput floor in bytes/sec; 0 = watchdog disabled (ADR-0021)
  string egress_throughput_probe_url = 14; // URL the throughput watchdog downloads through the active egress; empty = agent default
  // Dual-transport exit (ADR-0025; additive — an older agent ignores these and
  // stays AWG-only, backward-compatible, no wire-version bump).
  repeated string enabled_transports = 15; // master↔exit transports the exit runs; empty ⇒ ["awg"]
  string active_transport = 16; // the transport placed in the master LB; empty ⇒ "awg"
  RealitySrvSpec reality = 17; // VLESS+REALITY+XHTTP inbound spec (exit only; set when reality-xhttp enabled)
  // Host-hardening policy (role-agnostic). UNSET ⇒ both subsystems managed, which
  // is the pre-v6 behaviour and the fail-safe default: a spec that never mentions
  // hardening leaves the node hardened. Set explicitly by any controller that
  // understands fleet.hardening. Requires wire v6 — see NodeSpec.hardening in
  // internal/api/wire.go for why this could not be additive.
  HardeningSpec hardening = 18;
}

// HardeningSpec is the per-node host-hardening policy: which of the two managed
// hardening subsystems the agent reconciles. Message presence carries the
// operator's intent — a nil spec means "not configured", which the agent reads as
// both enabled, so the field names stay positive (`sshd: true` enables) instead of
// the double negative a bare proto3 bool would have forced.
message HardeningSpec {
  bool sshd = 1;     // reconcile the managed sshd drop-in (key-only auth, no X11)
  bool fail2ban = 2; // reconcile the managed fail2ban sshd jail
}

// RealitySrvSpec is the exit-side VLESS+REALITY+XHTTP inbound desired state
// (xray-core). Carries no private key — the exit generates its REALITY x25519
// keypair locally and publishes only the public key (key-broker model).
message RealitySrvSpec {
  int32 listen_port = 1;  // VLESS port (differs from the AWG port)
  string uuid = 2;        // VLESS user id (matches the master's RealityTunnel)
  string short_id = 3;    // REALITY short-id (hex)
  string server_name = 4; // camouflage SNI (serverNames[0])
  string dest = 5;        // camouflage target host:port (steal/fallback)
  string xhttp_path = 6;  // XHTTP path
  string xhttp_mode = 7;  // XHTTP mode ("packet-up")
  string image = 8;       // xray container image (pinned repo:tag)
  // Accept a ClientHello with no SNI (serverNames gains ""). Additive; an older
  // agent ignores it — backward-compatible, no wire-version bump (ADR-0019).
  bool allow_empty_sni = 9;
  // REALITY transport mode: "" / "xhttp" (default) / "vision" (TCP + vision flow).
  string mode = 10;
  // Allow xray to resolve dest/egress over IPv6. false ⇒ pin to IPv4 (data plane is
  // IPv4-only, #20). Additive; older agent ignores it — no wire bump (ADR-0019).
  bool allow_ipv6 = 11;
}

// MasterSpec is the master node's mihomo data plane.
message MasterSpec {
  string bind_address = 1;
  int32 redir_port = 2;
  string external_controller = 3;
  repeated ExitTunnel exit_tunnels = 4;
  string balance = 5;
  repeated string direct_cidrs = 6;
  repeated string direct_geo = 7;
  repeated string sniffer_skip = 8;
  CustomConfig custom = 9;
  ComposeSpec compose = 10;
  // Web dashboard controls (additive; an older agent ignores these and keeps the
  // default-on dashboard — backward-compatible, so no wire-version bump needed).
  bool dashboard_disabled = 11;
  string dashboard_url = 12;
  // TCP ports on the master mgmt address the client pool may reach (admin UIs:
  // controller Web UI, mihomo dashboard, wg-easy). Additive; an older agent ignores
  // it and keeps the strict default — backward-compatible, no wire-version bump.
  repeated int32 client_admin_ports = 13;
  // wg-best health-check cadence in seconds (detect/route around dead exits).
  // 0 ⇒ the agent's mihomo.DefaultHealthInterval. Additive; an older agent ignores
  // it and keeps the 60s default — backward-compatible, no wire-version bump.
  int32 health_check_interval = 14;
  // Forced-health-check threshold for the exit-selection groups (mihomo
  // max-failed-times). 0 ⇒ mihomo's default (5). Additive; an older agent ignores
  // it and keeps the default — backward-compatible, no wire-version bump.
  int32 max_failed_times = 15;
  // Client-facing VLESS+REALITY+XHTTP inbound (a DPI-resistant alternative to the
  // client AWG). Carries no private key — the master generates its REALITY x25519
  // keypair locally and publishes only the public key. Unlike the additive fields
  // above, a too-old agent that silently drops this leaves the operator-configured
  // client listener CLOSED with no error (a convergence difference, like
  // public_tcp_ports at v3), so it rides the wire-version bump to v4.
  ClientVlessSpec client_vless = 16;
  // Client-facing AmneziaWG interface, owned by the agent instead of wg-easy.
  // Carries NO client private keys: the controller issues the credentials and
  // renders the client configs itself, so the node only ever learns the public
  // half. nil ⇒ this master's client leg is still wg-easy's. A too-old agent that
  // drops the field leaves the interface unmanaged while the controller believes
  // it converged, so it rides a wire-version bump like client_vless did at v4.
  ClientWGSpec client_wg = 17;
}

// ClientWGSpec is the master-side desired state for the CLIENT-FACING AmneziaWG
// interface — the leg end users dial. Distinct from WGServerSpec, which describes
// the fleet-internal master↔exit leg: this one fronts many end users whose
// credentials are issued and revoked through the controller UI.
message ClientWGSpec {
  int32 listen_port = 1;              // UDP port clients dial
  string address_pool = 2;            // client subnet (CIDR)
  string server_address = 3;          // the master's own address inside the pool
  int32 mtu = 4;
  repeated string dns = 5;            // resolvers written into client configs
  repeated string allowed_ips = 6;    // what client configs route into the tunnel
  AWGParams awg = 7;                  // obfuscation for this interface (server end)
  // 8 was client_awg_local: the per-end decoy is DERIVED per credential from its
  // public key (see wg.clientDecoy), so it was never something a node needed to be
  // told. Reserved rather than reused — a number that once meant one thing must
  // never quietly come to mean another.
  reserved 8;
  string backend = 9;                 // "kernel" (default) | "userspace"
  repeated WGClientPeer clients = 10; // ENABLED credentials only
}

// WGClientPeer is the node-facing view of one issued credential: everything the
// agent needs to render a [Peer] block and nothing else. There is deliberately no
// private-key field — the controller renders client configs, so a client's
// private key has no reason to reach a node.
message WGClientPeer {
  string name = 1;
  string public_key = 2;
  string address = 3;        // with mask, e.g. 10.80.0.2/32
  string preshared_key = 4;  // optional; empty when unused
}

// ClientVlessSpec is the master-side, client-facing VLESS+REALITY+XHTTP inbound
// desired state (xray-core). It fronts many end users (unlike the single-user
// exit RealitySrvSpec) and forwards their decrypted traffic to mihomo over a
// loopback SOCKS hop, so VLESS clients share the AWG clients' routing. Carries no
// private key — the master generates its REALITY x25519 keypair locally and
// publishes only the public key.
message ClientVlessSpec {
  int32 listen_port = 1;             // world-facing TCP port (high/non-standard, 2026 recon)
  repeated VlessClient clients = 2;  // issued, non-revoked end-user credentials
  string server_name = 3;            // camouflage SNI (serverNames[0])
  string dest = 4;                   // camouflage target host:port (steal/fallback)
  string xhttp_path = 5;             // XHTTP path
  string xhttp_mode = 6;             // XHTTP mode ("packet-up")
  string mode = 7;                   // "" / "xhttp" (default) / "vision"
  bool allow_empty_sni = 8;          // accept a ClientHello with no SNI (RU TSPU bypass)
  bool allow_ipv6 = 9;               // false ⇒ pin xray resolution to IPv4 (#20)
  int32 socks_port = 10;             // loopback mihomo mixed/socks port to forward to; 0 = default
  string image = 11;                 // xray container image (pinned repo:tag)
}

// VlessClient is one issued end-user credential (UUID + REALITY short-id). Not
// secret — the REALITY private key stays on the master — so the controller stores
// and enumerates them to build vless:// links and to revoke access.
message VlessClient {
  string name = 1;     // operator-facing label, unique per master
  string uuid = 2;     // VLESS user id
  string short_id = 3; // this user's REALITY short-id (hex)
}

// ComposeSpec is the master's container-stack desired state (wg-easy + mihomo).
message ComposeSpec {
  string wg_easy_image = 1;
  string mihomo_image = 2;
  string public_ip = 3;
  int32 wg_easy_web_port = 4;
  repeated string client_dns = 5;
  string client_allowed_ips = 6;
}

// ExitTunnel is one master→exit mihomo WireGuard proxy.
message ExitTunnel {
  string name = 1;
  string endpoint = 2; // "host:port"
  string server_public_key = 3;
  string preshared_key = 4; // optional secret
  string tunnel_ip = 5;
  int32 mtu = 6;
  AWGParams awg = 7;
  bool drained = 8; // kept as a proxy but excluded from the load-balance group
  // Dual-transport (ADR-0025; additive). transport "" == "awg" (back-compat): the
  // AWG/server_public_key/tunnel_ip fields apply. For "reality-xhttp" the reality
  // field carries the mihomo vless proxy params instead.
  string transport = 9;
  RealityTunnel reality = 10;
  // Reserve puts this tunnel in the master's SECOND selection tier: it carries
  // traffic only when every primary tunnel is down (ADR-0029). Additive; an older
  // agent ignores it and renders one flat group — backward-compatible, no
  // wire-version bump.
  bool reserve = 11;
  // Per-tunnel master WireGuard identity (ADR-0030). Empty ⇒ the master's single
  // shared key (pre-ADR-0030 behaviour). Non-empty names the EXIT NODE the agent
  // derives a dedicated key for — never the proxy name, which may carry a
  // "-reality" suffix. Additive; an older agent ignores it and keeps using the
  // shared key — backward-compatible, no wire-version bump.
  string master_key_tunnel = 12;
}

// RealityTunnel is the master-side mihomo vless+reality proxy descriptor for a
// REALITY/XHTTP exit. Endpoint host:port comes from the enclosing ExitTunnel.
message RealityTunnel {
  string uuid = 1;        // VLESS user id (shared with the exit)
  string public_key = 2;  // exit's REALITY x25519 PUBLIC key (reality-opts.public-key)
  string short_id = 3;    // REALITY short-id (hex)
  string server_name = 4; // camouflage SNI (mihomo servername)
  string fingerprint = 5; // client uTLS fingerprint (mihomo client-fingerprint); "none" ⇒ omit
  string xhttp_path = 6;  // XHTTP path
  string xhttp_mode = 7;  // XHTTP mode ("packet-up")
  // Send the ClientHello with no SNI (mihomo servername = exit IP placeholder).
  // Additive; an older agent ignores it — backward-compatible (ADR-0019).
  bool empty_sni = 8;
  // REALITY transport mode: "" / "xhttp" (default) / "vision" (TCP + vision flow).
  string mode = 9;
  // Enable XHTTP connection reuse (XMUX) so the handshake/steal is amortized.
  // Additive; older agent ignores it — backward-compatible (ADR-0019).
  bool mux = 10;
}

// CustomConfig carries operator overrides (JSON-encoded for arbitrary nesting)
// and extra managed files.
message CustomConfig {
  string overrides_json = 1; // JSON object deep-merged into the rendered config
  repeated ManagedFile files = 2;
}

message ManagedFile {
  string path = 1;
  string content = 2;
  bool secret = 3;
}

message WGServerSpec {
  int32 listen_port = 1;
  string address_pool = 2;
  string address = 3;
  int32 mtu = 4;
  AWGParams awg = 5; // AmneziaWG obfuscation for this interface (server end); nil ⇒ vanilla WG
  // client_awg_local is the per-end junk/signatures (Jc/Jmin/Jmax, I1-I5) the
  // CLIENT side of this tunnel must emit. AWG allows these to differ per end, so
  // where they may differ they MUST: clients get their own decoy, distinct from
  // the server interface's (awg.local). The shared S1-S4/H1-H4 still come from awg
  // (clients derive them from the interface). nil ⇒ fall back to awg.local.
  AWGLocal client_awg_local = 6;
}

message PeerSpec {
  string name = 1;
  string public_key = 2;
  string endpoint = 3; // host:port; empty if the peer dials us
  repeated string allowed_ips = 4;
  int32 keepalive = 5;
  int32 mtu = 6;
  // Peers carry no obfuscation params: AmneziaWG lives in [Interface] only.
}

// AWGHeader is a packet-header type range [min,max]; the four H ranges must not
// overlap each other.
message AWGHeader {
  uint32 min = 1;
  uint32 max = 2;
}

// AWGShared — MUST be identical on both ends of a tunnel: H1-H4 and S1-S4, plus
// the whole AmneziaWG 3.0 block (wire v7).
//
// The 3.0 fields are additive, but a v6 agent DROPS them and renders a 2.0
// interface while the master's mihomo — rendered from the same controller — would
// emit `version: 3`. The two ends of the tunnel then disagree about the wire
// format and no handshake completes. Hence wire v7 AND the controller-side gate
// that refuses to hand 3.0 params to a node below it (see keybroker).
message AWGShared {
  AWGHeader h1 = 1;
  AWGHeader h2 = 2;
  AWGHeader h3 = 3;
  AWGHeader h4 = 4;
  int32 s1 = 5;
  int32 s2 = 6;
  int32 s3 = 7;
  int32 s4 = 8;

  // AmneziaWG 3.0. Empty across the board ⇒ a pure AWG 2.0 interface.
  string header_protection_key = 9;     // base64 chacha20 key; imposes S1-S4 >= 12
  string content_padding_addition = 10; // transport padding; receiver strips exactly this
  string rekey_after_time = 11;         // u16 range "N" or "min-max", redrawn per timer arm
  string rekey_timeout = 12;
  string reject_after_time = 13;
  string keepalive_timeout = 14;
  string max_handshake_attempts = 15;
}

// AWGLocal — MAY differ between the two ends: Jc/Jmin/Jmax and I1-I5.
message AWGLocal {
  int32 jc = 1;
  int32 jmin = 2;
  int32 jmax = 3;
  string i1 = 4;
  string i2 = 5;
  string i3 = 6;
  string i4 = 7;
  string i5 = 8;
}

message AWGParams {
  AWGShared shared = 1;
  AWGLocal local = 2;
}

// DNSFilterSpec configures the exit's blocky resolver (run as a container).
// Safety/structural fields are first-class; the rich surface (denylists,
// conditional mappings, caching) rides in custom (overrides + extra files).
message DNSFilterSpec {
  bool enabled = 1;
  string mgmt_addr = 2; // the ONLY non-loopback address blocky binds
  repeated string upstreams = 3; // default upstream group; safe defaults if empty
  DNSPorts ports = 4;
  repeated BootstrapUpstream bootstrap_dns = 5;
  repeated string allowlist = 6; // never-blocked domains (platform infra auto-added)
  bool prometheus = 7;
  string image = 8; // container image; default spx01/blocky
  CustomConfig custom = 9;
}

message DNSPorts {
  int32 dns = 1;   // default 53
  int32 tls = 2;   // default 853 (0 disables)
  int32 https = 3; // default 0 (disabled)
  int32 http = 4;  // default 4000 (0 disables)
}

message BootstrapUpstream {
  string upstream = 1;
  repeated string ips = 2;
}

message FirewallSpec {
  bool as_blacklist = 1;
  repeated string whitelist = 2;
  int32 wg_port = 3;
  int32 reality_port = 4; // TCP port for the REALITY/XHTTP inbound (ADR-0025); 0 = not opened
  // TCP ports opened to the WORLD (no interface scope) for publicly reachable
  // services, e.g. the decoy web listener. Role-agnostic. Contrast
  // MasterSpec.client_admin_ports, which is scoped to the client WG interface.
  repeated int32 public_tcp_ports = 5;
  // UDP ports opened to the WORLD (no interface scope) — the UDP sibling of
  // public_tcp_ports. Motivating case: a second ZeroTier node (a controller)
  // on a non-default port, because the node's own member instance holds 9993.
  repeated int32 public_udp_ports = 6;
}

message RoutingSpec {
  string egress_interface = 1;
  repeated string direct_cidrs = 2;
  string master_ip = 3;
  int32 fwmark = 4;
}

message ExportersSpec {
  bool node = 1;
  bool wg = 2;
  bool warp = 3;
}
