site_name: wgfleet
site_description: Operator documentation for wgfleet
site_url: https://shidoh.github.io/wgfleet-docs/
repo_url: https://github.com/shidoh/wgfleet
edit_uri: ""
docs_dir: build-docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  # Placeholder mark until the real icon lands; the plumbing is what matters.
  logo: docs/assets/logo.svg
  favicon: docs/assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    # Top-level groups become tabs; the sidebar shows only the current group.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  # Both schemes use the "custom" palette; the colours live in
  # docs/assets/extra.css so the site and the README share one identity.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light

# Footer links. Telegram is where every release is announced, with the archives
# attached.
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/wgfleet
      name: Release announcements on Telegram
    - icon: fontawesome/brands/github
      link: https://github.com/shidoh/wgfleet
      name: wgfleet on GitHub

extra_css:
  - docs/assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Only operator-facing pages are published. Engineering material stays out of
# the site: adr/ and dev/ are for people with repository access.
exclude_docs: |
  docs/adr/
  docs/dev/
  docs/index.md

# Every top-level entry is a section so that it gets its own tab; a one-page
# section (Changelog, Security) still reads better as a tab than as a stray
# link under Home.
nav:
  - Home: index.md
  - Getting started:
      - Quickstart: docs/QUICKSTART.md
      - System requirements: docs/requirements.md
      - Onboarding a node: docs/onboarding.md
      - Controller on the master: docs/colocated-controller-master.md
  - Configuration:
      - Manifest: docs/manifest.md
      - Key reference: docs/configuration.md
      - Secrets with SOPS: docs/secrets-sops.md
      - CLI: docs/cli.md
  - Operations:
      - Operations: docs/operations.md
      - Upgrading: docs/upgrade.md
      - Support bundle: docs/support-bundle.md
      - AmneziaWG 3.x for clients: docs/client-migration.md
  - Migrations:
      - Moving the master: docs/master-migration.md
  - Recipes:
      - RU split tunnel and DNS filtering: docs/recipes/ru-split-tunnel-dns-filter.md
  - Changelog:
      - Changelog: docs/changelog.md
  - Security:
      - Security policy: SECURITY.md
      - Disclaimer: DISCLAIMER.md
