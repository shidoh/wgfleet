# Example agent config. The agent is thin: identity + where the controller is.
# Everything else comes from the NodeSpec it pulls. See docs/DESIGN.md §8.
agent:
  role: exit # master | exit
  controller: "master-xa-1.mgmt:8443"
  node_id: "exit-de-1"
  reconcile_interval: 30s
  # mgmt_addr: this node's mgmt/overlay (ZeroTier) address. The agent binds its
  # Prometheus /metrics endpoint to mgmt_addr:9301 by default (no launch flag) and
  # uses it for other off-public surfaces. Baked in at provisioning. The --metrics
  # flag overrides the bind; --metrics off disables it.
  mgmt_addr: "10.20.3.22"
  # mgmt_overlay_mss: clamp TCP MSS on the ZeroTier interface (control-plane
  # insurance; keeps the mTLS handshake working if the overlay MTU is left at 2800).
  # Usually baked in from the controller's fleet.mgmt_overlay_mss at provisioning;
  # 1240 matches a 1280 overlay MTU. Omit / 0 to disable.
  # mgmt_overlay_mss: 1240
  identity:
    cert: "/etc/wgfleet/node.crt" # issued at bootstrap
    key: "/etc/wgfleet/node.key" # generated on-node, 0600, never leaves the box
    ca: "/etc/wgfleet/ca.crt" # CA cert used to verify the controller
