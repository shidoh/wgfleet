# wgfleet — Prometheus Operator ScrapeConfig (CRD) alternative.
#
# If your prometheus-operator is >= v0.65, the ScrapeConfig CRD scrapes static
# external targets directly — no Service/Endpoints plumbing. This is the simplest
# "just list the ZT addresses" option. Use EITHER this OR servicemonitor.yaml.
#
# Apply:  kubectl apply -f scrapeconfig.yaml
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: wgfleet-controller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack # <-- match Prometheus spec.scrapeConfigSelector
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 10.20.0.1:9300 # <-- EDIT: controller ZT address : metrics port
      labels:
        component: controller
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: wgfleet-agents
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  staticConfigs:
    # <-- EDIT: one ZT address per node, all on the agent metrics port 9301.
    - targets:
        - 10.20.0.1:9301 # master
        - 10.20.0.2:9301 # exit-1
        - 10.20.0.3:9301 # exit-2
        - 10.20.0.4:9301 # exit-3
      labels:
        component: agent
