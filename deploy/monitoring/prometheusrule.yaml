# wgfleet — alerting rules for Prometheus Operator (`PrometheusRule`).
#
# The Prometheus-Operator equivalent of `vmrule.yaml` — identical rule bodies.
# Companion to `servicemonitor.yaml` / `scrapeconfig.yaml`.
#
# Label this resource to match your Prometheus `spec.ruleSelector`
# (kube-prometheus-stack defaults to `release: <helm-release>`).
#
# Apply:  kubectl apply -f prometheusrule.yaml
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: wgfleet
  namespace: monitoring
  labels:
    app.kubernetes.io/name: wgfleet
    release: kube-prometheus-stack
spec:
  groups:
  - name: wgfleet.scrape
    interval: 30s
    rules:
    - alert: WgfleetConfigDrift
      expr: wgfleet_controller_config_drift == 1
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: the manifest on disk differs from the one the controller is running
        description: Someone edited controller.yaml and the change has not been applied — or was
          applied on a different host. The controller keeps serving the configuration it loaded at
          startup, so the edit has no effect and nothing else will say so. Run
          `wgfleet-controller --check-config` and then restart the controller.
    - alert: WgfleetControllerDown
      expr: up{job="wgfleet",component="controller"} == 0
      for: 3m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: wgfleet controller /metrics is unreachable
        description: The controller at {{ $labels.instance }} has not been scrapeable for 3m. The whole
          fleet is flying blind and no node can re-register.
    - alert: WgfleetAgentScrapeDown
      expr: up{job="wgfleet",component="agent"} == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'wgfleet agent /metrics unreachable: {{ $labels.instance }}'
        description: Agent metrics at {{ $labels.instance }} have been down for 10m. Either the agent
          is dead, or the mgmt overlay (ZeroTier) path to it is broken.
    - alert: WgfleetAgentUnscraped
      # `or vector(0)` because count() over an empty set returns no series, not 0:
      # with EVERY agent down the subtraction yielded nothing and the total-outage
      # case — the one that matters most — was the one case this could not report.
      # The same fix was applied to WgfleetNoReadyExit and missed here.
      # Fails open on a missing gauge — see WgfleetNoReadyExit for why.
      expr: (max(wgfleet_nodes{state="Ready"}) - (count(up{job="wgfleet",component="agent"} == 1) or vector(0)) > 0)
        unless on() (wgfleet_controller_store_up == 0)
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Fleet has more Ready nodes than scraped agents
        description: '{{ $value }} node(s) are Ready in the controller store but have no agent target
          in the wgfleet job. Add their mgmt addresses to the VMStaticScrape.'
    - alert: WgfleetDNSMetricsMissing
      # A node the controller knows that no blocky target is UP for. The blocky job is
      # a hand-kept list like the node-exporter one, and a new master can go
      # unscraped for days unless something asks this question for DNS.
      expr: |
        wgfleet_node_info{state!="Decommissioning"} == 1
          unless on(node) (up{job="blocky"} == 1)
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: No DNS metrics from {{ $labels.node }}
        description: The controller knows {{ $labels.node }} ({{ $labels.role }}) but no blocky target labelled node={{ $labels.node }} has been up for 30m. Add its mgmt address on 4000 to the blocky VMStaticScrape with node/role labels; until then that node's DNS is invisible.
    - alert: WgfleetVLESSStatsUnreadable
      # The master runs the client VLESS inbound but its xray did not answer the
      # stats API. Per-client VLESS traffic goes blank; the inbound itself may be
      # fine (client-vless health says that). Usually xray is restarting in a loop or
      # an operator-pinned image lacks the API.
      expr: wgfleet_vless_collector_up == 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: VLESS client stats unreadable on {{ $labels.node }}
        description: '{{ $labels.node }} runs the client-facing VLESS inbound, but xray has not answered its stats API on 127.0.0.1:10085 for 15m, so per-client VLESS traffic is blank. Check `docker logs xray` on the master and that its image is not pinned below 26.4.13.'
  - name: wgfleet.fleet
    interval: 30s
    rules:
    - alert: WgfleetNodeReportStale
      expr: wgfleet_node_last_report_age_seconds > 180
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} stopped reporting to the controller
        description: Last report from {{ $labels.node }} was {{ $value | humanizeDuration }} ago. The
          control channel is down (gRPC/mTLS, or MTU blackhole on the mgmt overlay).
    - alert: WgfleetNodeError
      expr: wgfleet_node_info{state="Error"} == 1
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} is in Error state
        description: Node {{ $labels.node }} ({{ $labels.role }}) has been in state Error for 5m.
    - alert: WgfleetNodeNotReady
      expr: wgfleet_node_info{state=~"Degraded|Pending|Provisioning|Reconciling"} == 1
      for: 20m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} stuck in {{ $labels.state }}
        description: Node {{ $labels.node }} ({{ $labels.role }}) has not reached Ready for 20m.
    - alert: WgfleetNodeReconcileFailed
      expr: wgfleet_node_reconcile_failed == 1
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Reconcile failing on {{ $labels.node }}
        description: The controller reports {{ $labels.node }} as reconcile-failed for 15m — the desired
          manifest is not being applied.
    - alert: WgfleetNodeDrainedTooLong
      expr: wgfleet_node_drain == 1
      for: 24h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} has been drained for 24h
        description: Drain is meant to be temporary (mihomo hot-reload / maintenance). {{ $labels.node
          }} has been out of rotation for a day — undrain it or decommission it.
    - alert: WgfleetNoReadyExit
      # `or vector(0)` is load-bearing: with no Ready exit the inner selector is
      # empty, count() returns no series at all, and the comparison can never be
      # true — the alert was silent in the exact condition it names.
      # Suppressed only when the store EXPLICITLY reports itself unreadable: an
      # unreadable store emits no node series, which is indistinguishable from an
      # empty fleet — this paged "every exit is out of rotation" for a locked SQLite
      # file while the data plane ran fine.
      #
      # `unless … == 0` and not `and … == 1` on purpose. The gauge is new; with `and`
      # the whole expression is empty until every controller publishes it, so
      # applying these rules before the binary would turn this critical alert OFF
      # rather than merely quieten it — a deployment-order trap with no signal. This
      # form fails OPEN: no gauge means no suppression, and the alert behaves exactly
      # as it did before.
      expr: ((count(wgfleet_node_info{role="exit",state="Ready"} == 1) or vector(0)) < 1)
        unless on() (wgfleet_controller_store_up == 0)
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No Ready exit node left in the fleet
        description: Every exit is out of rotation. Client traffic has nowhere to egress.
  - name: wgfleet.health
    interval: 30s
    rules:
    - alert: WgfleetHealthCheckFailing
      expr: wgfleet_node_health_check == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Health check {{ $labels.check }} failing on {{ $labels.node }}
        description: Check '{{ $labels.check }}' on node {{ $labels.node }} has been failing for 10m.
    - alert: WgfleetLifelineCheckMissing
      # The reserve client leg fails silently by construction: nothing else on the
      # exit notices when awgl0 is gone, and the health check that reports it is only
      # BUILT when the controller renders a lifeline into the node spec. So the check
      # vanishing — an agent below wire v11, a spec that stopped rendering, a manifest
      # edit — reads exactly like health to WgfleetClientPathDown, which can only fire
      # on a series that exists. An absent series must be the loudest case, not the
      # quietest. 30m, because restarts and rolling upgrades drop it briefly.
      expr: absent(wgfleet_node_health_check{check="lifeline"})
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: No exit is reporting a lifeline health check
        description: The 'lifeline' health check has not been reported by any node for 30m.
          Either no exit carries a reserve client interface any more, or the controller
          stopped rendering one. Reserve profiles already handed out may no longer work.
    - alert: WgfleetClientPathDown
      # client-wg.* rather than client-wg: the check reporting whether the AGENT
      # carries the client interface is named client-wg-owned, and a Prometheus
      # regexp is fully anchored, so the narrower pattern excluded it.
      expr: wgfleet_node_health_check{check=~"client-wg.*|client-vless|lifeline"} == 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: 'Client entry point down on {{ $labels.node }}: {{ $labels.check }}'
        description: The client-facing inbound '{{ $labels.check }}' on {{ $labels.node }} has
          been failing for 5m. New clients cannot connect.
    # wgfleet_agent_egress_reachability and _egress_active are INFO gauges: the
    # agent calls Reset() then Set(1) on the label that is currently true, so the
    # value is always 1 and never 0. Both of these alerted on `== 0` and therefore
    # could not fire — one of them at severity: critical. The state lives in the
    # LABEL, so that is what these match on now.
    # Both of these can only fire on an exit running WARP. EgressClassifier returns
    # no class unless a `warp-egress` health check is present, and ObserveEgress
    # no-ops on an empty one — so an exit with `egress: direct` publishes no
    # reachability series and neither rule can ever fire for it. That is correct for
    # a WARP-reachability probe and misleading as a fleet-wide guarantee: on a
    # direct-egress fleet the critical "your users' traffic is blackholed" signal
    # does not exist, and the dashboard's Egress panel shows No data rather than 0.
    - alert: WgfleetWARPEgressBlocked
      expr: wgfleet_agent_egress_reachability{state="blocked"} == 1
      for: 10m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: WARP egress blocked on exit {{ $labels.node }}
        description: 'Exit {{ $labels.node }} classifies its WARP egress as blocked. Traffic routed to
          this exit is blackholed. Only exits running WARP publish this; an exit on direct egress
          cannot raise it.'
    - alert: WgfleetWARPEgressDegraded
      expr: wgfleet_agent_egress_reachability{state="degraded"} == 1
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: WARP egress degraded on exit {{ $labels.node }}
        description: Exit {{ $labels.node }} has been running on a degraded WARP egress path for 30m.
          Only exits running WARP publish this.
  - name: wgfleet.reconcile
    interval: 30s
    rules:
    - alert: WgfleetReconcileErrors
      # One failed pass out of thirty held this true for the entire 15m window, so
      # the 5m `for:` was met by construction: a single RPC timeout on a flaky link
      # paged, and the agent had already self-healed by the time anyone looked. What
      # matters is not converging — hence the second clause, which is what separates
      # "wobbling but recovering" from "stuck".
      # `ignoring(result)` is load-bearing and its absence made this rule DEAD: the
      # counter carries a `result` label, so the left side is result="error" and the
      # right is result="success". A bare `and` matches on every label including that
      # one, the signatures never line up, and the whole expression is empty — off,
      # not quieter, in exactly the not-converging case it exists for.
      expr: increase(wgfleet_agent_reconcile_total{result!="success"}[30m]) > 5
        and ignoring(result) increase(wgfleet_agent_reconcile_total{result="success"}[30m]) == 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Agent reconcile errors on {{ $labels.node }}
        description: '{{ $value | printf "%.0f" }} failed reconcile pass(es) in the last 30m, with none succeeding, on {{ $labels.node
          }} (result={{ $labels.result }}).'
    - alert: WgfleetPersistentDrift
      expr: increase(wgfleet_agent_drift_total[1h]) > 10
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Config drift keeps recurring on {{ $labels.node }}
        description: Component '{{ $labels.exported_component }}' on {{ $labels.node }} drifted {{ $value
          | printf "%.0f" }} times in an hour — something else is fighting the agent for that resource.
    - alert: WgfleetAgentFlapping
      expr: changes(wgfleet_agent_start_time_seconds[1h]) > 3
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: wgfleet-agent restarting repeatedly on {{ $labels.node }}
        description: The agent on {{ $labels.node }} restarted {{ $value | printf "%.0f" }} times in the
          last hour.
    - alert: WgfleetMihomoRestartLoop
      # Every restart of the container — a self-heal, a crash, docker's restart
      # policy — steps the start time forward, so this counts restarts no single
      # restarter has to confess to. A planner that restarts mihomo every
      # pass knocks exits out of rotation within minutes, and the only record
      # is the master agent's journal. Each restart drops mihomo's userspace
      # WireGuard devices, which is why it is an outage and not a blip.
      expr: changes(wgfleet_agent_mihomo_start_time_seconds[30m]) > 2
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: mihomo on {{ $labels.node }} restarted {{ $value }} times in 30m
        description: mihomo's container on {{ $labels.node }} has restarted {{ $value }} times in the last 30 minutes. Each restart tears down the master↔exit tunnels. Check wgfleet_agent_self_heal_restarts to see whether the agent is doing it, and the mihomo log for why.
    - alert: WgfleetSelfHealThrottled
      # The restart governor has stopped restarting a service because restarts keep
      # being needed. That is the SAME defect as a restart loop with the symptom
      # muted — fewer restarts here is not recovery, and a rule watching restarts
      # alone would fall silent at exactly the moment a person is needed.
      expr: wgfleet_agent_self_heal_throttled == 1
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Self-heal of {{ $labels.service }} on {{ $labels.node }} is throttled
        description: The agent on {{ $labels.node }} has restarted {{ $labels.service }} too often and is now refusing to; the service is left in whatever state the last restart produced. Investigate the cause rather than waiting for the backoff to expire.
    - alert: WgfleetReconcileNeverConverges
      # A node that changes something on EVERY pass for half an hour is not
      # converging, it is fighting itself: a planner whose probe reads the wrong
      # namespace, a file two planners both own, an interface that comes up and is
      # torn down again. Every point check is green while it happens (each pass
      # succeeds); only the shape over time shows it.
      expr: min_over_time(wgfleet_agent_reconcile_changes[30m]) > 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: "{{ $labels.node }} changes something on every reconcile pass"
        description: Every reconcile pass on {{ $labels.node }} ({{ $labels.role }}) in the last 30m applied at least one change. A converged node applies none; something is being repaired and undone in a loop. The agent journal names the component.
  - name: wgfleet.versions
    interval: 1m
    rules:
    - alert: WgfleetWireVersionSkew
      expr: count(count by (wire_version) (wgfleet_node_agent_info)) > 1
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Agents disagree on control-plane wire version
        description: More than one wire_version is live in the fleet for 30m. A rollout is stuck half-applied.
    - alert: WgfleetAgentVersionSkew
      expr: count(count by (agent_version) (wgfleet_node_agent_info)) > 1
      for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Fleet is running mixed agent versions
        description: More than one agent_version has been live for 6h — a rollout was never finished.
  - name: wgfleet.rotation
    interval: 30s
    rules:
    # The master↔exit tunnels are userspace mihomo proxies, not kernel WireGuard,
    # so no wg_* series covers them. Without these rules an exit can drop out of
    # the load balancer for weeks with the master agent's journal as the only
    # record.
    - alert: WgfleetExitOutOfRotation
      # Two health criteria write mihomo's alive flag: its own group check (one
      # lightweight URL) and the master agent's multi-destination probe. When this
      # fires, wgfleet_agent_exit_held_out{exit=...} says which one did it — 1 means
      # our stricter probe took the exit out, i.e. it could not reach enough
      # independent destinations, the censored-but-"healthy" signature.
      # Scoped to the tier that actually carries traffic. A dual-transport exit
      # renders BOTH an AWG and a "<exit>-reality" proxy, but only one of them is in
      # a group — the other is configured, routed through by nobody, and never
      # probed, so its alive/age readings drift forever: an inactive AWG proxy can
      # sit at alive=0 with an hour-old measurement while its reality proxy is
      # fresh, and an unscoped alert would page permanently on a tunnel with no
      # traffic on it by design.
      #
      # wgfleet_agent_exit_held_out enumerates exactly the active tier's members, so
      # it is the gate. The coupling is deliberate but worth knowing: it comes from
      # the master AGENT scrape while the gated series comes from the CONTROLLER, so
      # if the agent stops being scraped these go quiet — WgfleetAgentScrapeDown is
      # what covers that.
      expr: wgfleet_exit_tunnel_alive == 0 and on(node, exit) wgfleet_agent_exit_held_out
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Exit {{ $labels.exit }} is out of the load balancer on {{ $labels.node }}
        description: mihomo on {{ $labels.node }} has {{ $labels.exit }} marked down, so wg-best is
          not routing client traffic to it. Check wgfleet_agent_exit_held_out{exit="{{ $labels.exit }}"}
          to tell our multi-destination verdict from mihomo's own check.
    - alert: WgfleetAWGExitNotHeard
      # Exit-initiated AWG flow (transports.awg.exit_initiated): the master answers
      # such an exit only after hearing it knock on its pinned port, and the gate is
      # closed until then by design — opening it on a timeout would make the master
      # the flow's initiator, which is what the path filter cuts. So a quiet exit is
      # a tunnel that stays down, and nothing else on the fleet says why. The exit's
      # keepalive is 15-28 s; ten minutes is long past any lost packet.
      expr: wgfleet_agent_awg_pin_armed == 1 and on(node, exit) wgfleet_agent_awg_exit_heard == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Master {{ $labels.node }} has not heard exit {{ $labels.exit }} knock on its pinned port
        description: The AWG tunnel to {{ $labels.exit }} waits for the exit to start the flow and the
          exit is silent. On the exit check `awg show awg0 endpoints` points at the master's pinned
          port; on the master check `tcpdump -ni any udp and src host <exit>` for its knocks.
    - alert: WgfleetNoExitInRotation
      # Per master: each master's wg-best group is its own, so one master with
      # every tunnel down is an outage for its clients even while another master
      # still has a live exit. The left side lists the masters that have an active
      # tier at all (the held-out family has one series per active-tier exit), so a
      # controller or agent that does not yet export these series stays silent
      # instead of paging on an empty selector; the first `unless` drops the
      # masters that still have a live exit, the second silences the rule while the
      # controller's own store is down. WgfleetNoReadyExit covers the same outage
      # from the node-state side.
      expr: (count by (node) (wgfleet_agent_exit_held_out) > 0)
        unless on(node) (count by (node) (wgfleet_exit_tunnel_alive == 1 and on(node, exit) wgfleet_agent_exit_held_out) > 0)
        unless on() (wgfleet_controller_store_up == 0)
      for: 2m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No exit left in the load balancer of master {{ $labels.node }}
        description: Every master↔exit tunnel of {{ $labels.node }} is marked down. Its clients have
          nothing to egress through even though the exits themselves may be Ready.
    - alert: WgfleetExitTunnelHealthStale
      # mihomo's alive flag is STICKY: it holds whatever the last probe wrote. A
      # master that stopped probing therefore reports every tunnel confidently alive
      # forever, and WgfleetExitOutOfRotation above goes quiet for the best possible
      # reason and the worst possible cause. The age is what separates a fresh
      # reading from a frozen one.
      # Same active-tier gate as WgfleetExitOutOfRotation, for the same reason: an
      # unrouted standby-transport proxy is never probed, so its age grows without
      # bound and means nothing.
      expr: wgfleet_exit_tunnel_last_test_age_seconds > 300 and on(node, exit) wgfleet_agent_exit_held_out
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Tunnel health for {{ $labels.exit }} is frozen on {{ $labels.node }}
        description: The last delay measurement of {{ $labels.exit }} is {{ $value | humanizeDuration }}
          old, so its alive/selected state is stale rather than healthy. The master's mihomo probe or
          its Clash API has stopped answering.
    - alert: WgfleetReserveTierActive
      # Not an outage — the failover worked — but the fleet is running on the tier
      # it keeps for emergencies, and nothing else says so out loud.
      expr: wgfleet_agent_reserve_tier_active == 1
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: '{{ $labels.node }} is routing through the RESERVE exit tier'
        description: Every primary exit failed the multi-destination probe, so wg-best failed over
          to the second-choice tier. Client traffic is served, but there is nothing left to fail
          over to.
    - alert: WgfleetStandbyTierUnusable
      # The half of a failover decision that is normally invisible: not "is the
      # active tier dying" but "can the tier we would move every client onto reach
      # the internet at all". total == 0 means it was never sampled, which is a
      # different fault and is left to WgfleetExitTunnelHealthStale.
      expr: wgfleet_agent_standby_tier_total > 0 and wgfleet_agent_standby_tier_usable == 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: The standby exit tier on {{ $labels.node }} has no usable member
        description: The warm probe found no reachable exit in the INACTIVE tier. A failover right
          now would land every client on a tier that cannot reach the internet.
    - alert: WgfleetStandbyTierMemberUnusable
      # The tally next to this (standby_tier_usable/total) only fires when the LAST
      # reserve member dies, so one dead member hides inside "2 of 3 usable" and
      # nothing ever names it: a reserve exit's active transport can fail for
      # minutes at a time behind a confident 3/3, invisible in both the alerts
      # and the console.
      #
      # Not an outage and deliberately not critical: the reserve tier carries no
      # traffic while the primary is healthy. It is a fallback that would not
      # restore anything, which is worth knowing BEFORE the failover, not during.
      expr: wgfleet_agent_standby_tier_member_usable == 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Reserve exit {{ $labels.exit }} is unusable on {{ $labels.node }}
        description: The warm probe reached none of its destinations through {{ $labels.exit }}.
          It carries no client traffic today, so nothing is broken for users right now — but the
          reserve tier is one member short of what it claims to be.
    - alert: WgfleetStandbyTransportUnusable
      # A dual-transport exit keeps its inactive transport configured but out of
      # the load-balance group, so nothing dials it and — until the probe behind
      # this rule existed — nothing knew whether it worked: an untested standby
      # reports mihomo's default of alive=1. A confident green on no evidence.
      #
      # This is not an outage: the exit is serving over its active transport. It is
      # a MISSING FALLBACK, and the switch that needs it is an emergency move made
      # exactly when the active path has been blocked — the worst moment to find
      # out the other one is dead too. Warning, not critical, for that reason.
      #
      # No active-tier gate here (unlike the rotation alerts): the standby is out of
      # rotation BY DESIGN, so gating on rotation membership would silence the rule
      # in every case it exists for. The series is only emitted for an exit that
      # actually has a standby, which is the scoping this needs.
      expr: wgfleet_agent_standby_transport_usable == 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Exit {{ $labels.exit }} has no working fallback: its {{ $labels.transport }} standby is unusable'
        description: The standby {{ $labels.transport }} transport on {{ $labels.exit }} could not reach
          enough independent destinations. The exit is still serving over its active transport, but
          switching it over would not restore anything — so it currently has no fallback.
    - alert: WgfleetRealityBridgeDown
      # An exit in the exit-initiated REALITY mode dials every ready
      # master's portal. Its own health check asks only for one of them, so that one
      # master's path going dark leaves the exit Ready — and that master without a
      # REALITY tunnel to it. Absent outside the mode.
      expr: wgfleet_agent_reality_bridge_connected == 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Exit {{ $labels.node }} holds no REALITY bridge to master {{ $labels.master }}'
        description: The exit's bridge has held no connection to {{ $labels.master }}'s portal for 5m.
          That master cannot reach this exit over REALITY; other masters may still. Check the
          portal on the master (reality-portal check) and wgfleet_agent_reality_bridge_kills_total.
    - alert: WgfleetExitFlapping
      # A hold-out of three minutes starts and ends between the 5 m that
      # WgfleetExitOutOfRotation waits, and the exit_held_out gauge misses it
      # between scrapes, so a master can keep dropping one exit out of the load
      # balancer with the console the only place it shows. The counter
      # sees every hold-out; two in six hours on one exit is already a pattern.
      expr: increase(wgfleet_agent_exit_holdouts_total[6h]) >= 2
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Master {{ $labels.node }} took exit {{ $labels.exit }} out of rotation {{ $value | humanize }} times in 6h'
        description: Each time the master's multi-destination probe found the tunnel to {{ $labels.exit }}
          dead, clients through it stalled until it came back. Look at the path from this master to the
          exit — for an exit-initiated REALITY exit, wgfleet_agent_reality_bridge_kills_total.
    - alert: WgfleetRealityBridgeUnstable
      # The bridge's watchdog kills a socket that received nothing for 30 s and the
      # exit redials, so WgfleetRealityBridgeDown never fires — but every kill is
      # traffic frozen on that path. A bridge can run at several kills an hour for
      # days with no other rule noticing.
      expr: increase(wgfleet_agent_reality_bridge_kills_total[1h]) > 3
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Exit {{ $labels.node }}: REALITY bridge to master {{ $labels.master }} froze {{ $value | humanize }} times in the last hour'
        description: Connections from {{ $labels.node }} to {{ $labels.master }}'s portal keep going
          silent one way and are killed and redialled. Each freeze stalls the traffic on it for about
          30 s, and enough of them take the exit out of that master's rotation. Compare with the same
          exit's bridge to the other masters to tell the master's path from the exit's.
  - name: wgfleet.paths
    interval: 5m
    rules:
    # Blocking creeps in: a provider's TSPU box or a hoster's uplink starts
    # delaying or dropping a share of one path, and the share grows over days.
    # A path can go from a few percent slow probes to over a third in ten days
    # while every rotation alert stays quiet, because the median stays low and
    # the tunnels never go down.
    #
    # A probe is BAD when it took over 1 s or failed (the delay series is absent
    # after a failed probe, the age series is not). Frozen readings (age > 300 s)
    # are left out: they repeat one old value. The share is per day.
    #
    # The baseline is the path's BEST day of the two weeks before, not its
    # average: a creep that lasts a week becomes its own average and the alert
    # would go quiet on the plateau. A creep cannot raise the best day until all
    # 14 days are bad, and a path that is always noisy has its noise as its best day.
    - record: wgfleet:exit_tunnel_bad_share:1d
      expr: avg_over_time((((wgfleet_exit_tunnel_delay_seconds > bool 1) or on(node, exit) (0 * wgfleet_exit_tunnel_last_test_age_seconds + 1)) and on(node, exit) (wgfleet_exit_tunnel_last_test_age_seconds < 300))[1d:2m])
    - record: wgfleet:exit_tunnel_bad_share:best_day_14d
      expr: min_over_time((avg_over_time((((wgfleet_exit_tunnel_delay_seconds > bool 1) or on(node, exit) (0 * wgfleet_exit_tunnel_last_test_age_seconds + 1)) and on(node, exit) (wgfleet_exit_tunnel_last_test_age_seconds < 300))[1d:10m]))[14d:6h] offset 1d)
    # One path is DEGRADING when all of these hold:
    #   - over 10% of the day's probes are bad, and under 80% (a dead path is
    #     WgfleetExitOutOfRotation's and the standby alerts' business);
    #   - it is 8 points worse than the best master's path to the same exit, so
    #     an exit that is slow from everywhere does not count here;
    #   - it is over twice its best day plus 3 points.
    # Gaps of a few hours between firing hours are covered by keep_firing_for.
    # A path younger than a day stays silent.
    - alert: WgfleetMasterPathsDegrading
      # Two or more exits degrading from one master while the other masters reach
      # them fine: the master's own uplink, i.e. its hoster or a TSPU in front of
      # it. One alert per master instead of one per path.
      expr: |
        count by (node) (
          (wgfleet:exit_tunnel_bad_share:1d > 0.10)
          and (wgfleet:exit_tunnel_bad_share:1d < 0.8)
          and (wgfleet:exit_tunnel_bad_share:1d - on(exit) group_left() min by (exit) (wgfleet:exit_tunnel_bad_share:1d) > 0.08)
          and (wgfleet:exit_tunnel_bad_share:1d > 2 * wgfleet:exit_tunnel_bad_share:best_day_14d + 0.03)
        ) >= 2
      for: 1h
      keep_firing_for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Paths from master {{ $labels.node }} to {{ $value }} exits are degrading'
        description: >-
          Over the last day {{ $value }} of {{ $labels.node }}'s exit tunnels lost or delayed
          (over 1 s) a growing share of probes, while other masters reach the same exits fine. Look at
          the master's own uplink: TCP connects to neutral addresses (ya.ru, 1.1.1.1) slower than the
          ping RTT, SYN retransmits. Per path: wgfleet:exit_tunnel_bad_share:1d{node="{{ $labels.node }}"}.
    - alert: WgfleetExitPathDegrading
      # The same test for one path, when its master is not already under
      # WgfleetMasterPathsDegrading.
      expr: |
        (
          (wgfleet:exit_tunnel_bad_share:1d > 0.10)
          and (wgfleet:exit_tunnel_bad_share:1d < 0.8)
          and (wgfleet:exit_tunnel_bad_share:1d - on(exit) group_left() min by (exit) (wgfleet:exit_tunnel_bad_share:1d) > 0.08)
          and (wgfleet:exit_tunnel_bad_share:1d > 2 * wgfleet:exit_tunnel_bad_share:best_day_14d + 0.03)
        )
        unless on(node) (
          count by (node) (
            (wgfleet:exit_tunnel_bad_share:1d > 0.10)
            and (wgfleet:exit_tunnel_bad_share:1d < 0.8)
            and (wgfleet:exit_tunnel_bad_share:1d - on(exit) group_left() min by (exit) (wgfleet:exit_tunnel_bad_share:1d) > 0.08)
            and (wgfleet:exit_tunnel_bad_share:1d > 2 * wgfleet:exit_tunnel_bad_share:best_day_14d + 0.03)
          ) >= 2
        )
      for: 1h
      keep_firing_for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Path {{ $labels.node }} -> {{ $labels.exit }} is degrading: {{ $value | humanizePercentage }} bad probes'
        description: >-
          {{ $value | humanizePercentage }} of the day's probes from {{ $labels.node }} to
          {{ $labels.exit }} failed or took over 1 s, more than twice its best day of the two weeks before, while
          another master reaches {{ $labels.exit }} fine. The path between the two is degrading:
          a filter on one of the two providers, or between them.
    - alert: WgfleetExitDegradingFromAllMasters
      # The case the per-path rules exclude by design: every master's path to one
      # exit degrades together - the exit's hoster, or its address being filtered
      # where the masters are. Needs at least two masters to say "all".
      expr: |
        (min by (exit) (wgfleet:exit_tunnel_bad_share:1d) > 0.10)
        and (min by (exit) (wgfleet:exit_tunnel_bad_share:1d) < 0.8)
        and (min by (exit) (wgfleet:exit_tunnel_bad_share:1d) > 2 * max by (exit) (wgfleet:exit_tunnel_bad_share:best_day_14d) + 0.03)
        and (count by (exit) (wgfleet:exit_tunnel_bad_share:1d) >= 2)
      for: 1h
      keep_firing_for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Exit {{ $labels.exit }} is degrading from every master: at least {{ $value | humanizePercentage }} bad probes'
        description: >-
          Every master lost or delayed (over 1 s) at least {{ $value | humanizePercentage }} of
          the day's probes to {{ $labels.exit }}, more than twice their best day of the two weeks before. The problem is
          on the exit's side: its hoster or a filter on its address.
    # The master's own uplink, measured by TCP connects to the other masters
    # (wgfleet_agent_uplink_probes_total). Bad = slow (a retransmitted SYN, over
    # 0.9 s), refused (a reset: filters inject them; a peer restart costs a minute,
    # nothing in a daily share) or failed. Daily share per (node, peer), and its
    # best day of the two weeks before.
    - record: wgfleet:uplink_probe_bad_share:1d
      expr: |
        sum by (node, peer) (increase(wgfleet_agent_uplink_probes_total{result=~"slow|fail|refused"}[1d]))
        / sum by (node, peer) (increase(wgfleet_agent_uplink_probes_total[1d]))
    - record: wgfleet:uplink_probe_bad_share:best_day_14d
      expr: |
        min_over_time((
          sum by (node, peer) (increase(wgfleet_agent_uplink_probes_total{result=~"slow|fail|refused"}[1d]))
          / sum by (node, peer) (increase(wgfleet_agent_uplink_probes_total[1d]))
        )[14d:6h] offset 1d)
    # The same share measured the other way: node and peer swapped, so a series
    # {node="A", peer="B"} here is what B saw dialling A.
    - record: wgfleet:uplink_probe_bad_share:1d_reverse
      expr: |
        sum without (swap) (
          label_replace(label_replace(label_replace(wgfleet:uplink_probe_bad_share:1d,
            "swap", "$1", "node", "(.*)"),
            "node", "$1", "peer", "(.*)"),
            "peer", "$1", "swap", "(.*)")
        )
    # Passive, for the dashboard: SYNs the master sent per SYN-ACK it got on its
    # uplink address, per day. Near 1 on a clean uplink.
    - record: wgfleet:uplink_syn_per_synack:1d
      expr: |
        sum by (node) (increase(wgfleet_fw_uplink_handshake_packets_total{direction="syn_out"}[1d]))
        / sum by (node) (increase(wgfleet_fw_uplink_handshake_packets_total{direction="synack_in"}[1d]))
    - alert: WgfleetMasterUplinkDegrading
      # Connects from this master to a peer degrade while the peer's connects
      # back to it stay clean: the filter is on this master's side.
      # Under 80% only: a peer whose port closed is a dead target,
      # not a creeping filter. Silent until a day of probes exists.
      expr: |
        (wgfleet:uplink_probe_bad_share:1d > 0.05)
        and (wgfleet:uplink_probe_bad_share:1d < 0.8)
        and (wgfleet:uplink_probe_bad_share:1d > 2 * wgfleet:uplink_probe_bad_share:best_day_14d + 0.02)
        and on (node, peer) (wgfleet:uplink_probe_bad_share:1d_reverse < 0.02)
      for: 1h
      keep_firing_for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Uplink of master {{ $labels.node }} is degrading: {{ $value | humanizePercentage }} of connects to {{ $labels.peer }} slow or failed'
        description: >-
          {{ $value | humanizePercentage }} of the day's TCP connects from {{ $labels.node }} to
          {{ $labels.peer }} took over 0.9 s (a retransmitted SYN) or failed, while {{ $labels.peer }}
          connects back cleanly. Something in front of {{ $labels.node }} drops or delays its
          handshakes: its hoster or a filter. Compare wgfleet:uplink_syn_per_synack:1d across masters.
  - name: wgfleet.dataplane
    interval: 1m
    rules:
    - alert: WgfleetWireGuardHandshakeStale
      # wg0 and awgl0 are EXCLUDED: they are the client-facing interfaces, where a
      # stale handshake is a phone in a pocket, not a fault. Left in, this fired once
      # per sleeping device — and on awgl0, the RESERVE leg, every healthy peer is one
      # nobody has needed for months. Mass client loss is covered by
      # WgfleetNoClientPeers below.
      expr: wgfleet_wg_handshake_age_seconds{iface!~"wg0|awgl0"} > 300
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Stale WireGuard handshake on {{ $labels.node }}/{{ $labels.iface }}
        description: Peer {{ $labels.peer }} on {{ $labels.iface }} ({{ $labels.node }}) last handshook
          {{ $value | humanizeDuration }} ago.
    - alert: WgfleetNoClientPeers
      # The single best signal that end users have lost the fleet: the client
      # interface is up and authenticating nobody.
      # The `or` arm is load-bearing. For as long as this rule existed the series
      # it watches was emitted by NOBODY — the collector shelled to `wg show` on
      # nodes that only have `awg` — so the alert could not fire, and its silence
      # read exactly like health. An absent series must be the loudest case here,
      # not the quietest.
      # Split, because the two halves are not the same event. A collector that
      # cannot read the interface is unambiguous and stays critical. Zero peers is
      # NOT: peers_active counts handshakes inside a 3-minute window, so a laptop
      # asleep and a phone with the tunnel off is a genuine, correct zero for hours.
      # As written this paged critical most nights, which is how a channel stops
      # being read. Requiring that the interface HAD peers in the last 24h keeps the
      # collapse case (they were here, now none are) and drops the quiet night: a
      # window shorter than a day would let a weekend of no traffic read as recovery.
      #
      # The collector-down arm is NOT the same event and stays unconditional — with
      # one caveat: WGCollector reports collector_up=0 for an interface it cannot
      # dump, and a master that does not run the client leg has no wg0 at all, so
      # that master pages this forever. Until the collector distinguishes "absent"
      # from "unreadable", drop this rule for a fleet mid-migration.
      expr: (wgfleet_wg_collector_up{iface="wg0"} == 0)
        or (wgfleet_wg_peers_active{iface="wg0"} == 0
            and max_over_time(wgfleet_wg_peers_active{iface="wg0"}[24h]) > 0)
      for: 10m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No client has a live handshake on {{ $labels.node }}
        description: The client-facing interface on {{ $labels.node }} has had zero active peers for
          10m. Either every client is offline at once, or the interface is serving an empty peer set.
    - alert: WgfleetAWGGenerationSwitchNoHandshake
      # An interface switched AmneziaWG generation (header protection on or off)
      # within the last half hour and has no peer with a live handshake since. A
      # switch is the moment a peer on the old generation stops being able to
      # handshake at all — a client that has not fetched the new profile, an end
      # the other side has not reached yet — and this is the window to look before
      # going on with the next step of a migration. Warning: the rest of the fleet
      # carries traffic, and a quiet interface outside that window is someone
      # else's alert. wgcf is the WARP uplink, never ours to switch; awgl0 is the
      # lifeline, whose peers are offline files by design and never handshake
      # until a master is lost. The offset arm keeps a series that only just
      # appeared (a new agent) from counting as a switch: VictoriaMetrics counts
      # the first sample of a series as a change.
      expr: changes(wgfleet_awg_header_protection{iface!~"wgcf|awgl0"}[30m]) > 0
        and on(node, iface) (wgfleet_awg_header_protection offset 30m)
        and on(node, iface) wgfleet_wg_peers_active == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: No handshake on {{ $labels.node }} {{ $labels.iface }} after an AmneziaWG generation switch
        description: '{{ $labels.iface }} on {{ $labels.node }} switched AmneziaWG generation in the last
          30m and has had no peer with a live handshake for 10m. Peers still on the old generation
          cannot connect; check them before the next migration step.'
    - alert: WgfleetClientPathDead
      # The master's own client cannot get traffic through the path its users take.
      # This is the only alert that measures the whole sentence rather than a
      # component: client QUIC can be dead for days while the master<->exit link
      # shows 0% loss, exit egress is healthy, every proxy is alive and no unit has
      # failed — because each of those measures a component and every component is
      # fine.
      expr: wgfleet_agent_client_path_ok == 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: "the client path is dead for {{ $labels.probe }} on {{ $labels.node }}"
        description: >-
          The master's own synthetic client could not complete a
          {{ $labels.probe }} exchange through the client interface, the firewall,
          mihomo and an exit. Real clients take the same path. Reproduce with
          `ip netns exec wgfleet-synth curl -v https://cp.cloudflare.com/generate_204`
          on the master.
    - alert: WgfleetMihomoComplaining
      # mihomo writes its own failures to the container log and nothing read them.
      # A TPROXY reply failure that kills every client QUIC flow announces itself
      # there on every packet while every other metric stays green. Deliberately unclassified: the next failure of this class will carry a
      # different message, and what generalises is that the data plane is complaining.
      expr: rate(wgfleet_agent_mihomo_errors_total[15m]) > 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: "mihomo is logging errors on {{ $labels.node }}"
        description: >-
          mihomo has been writing error lines steadily for 15 minutes. Read them
          with `docker logs mihomo --since 15m | grep level=error`. A steady rate
          usually means a per-packet or per-connection failure rather than a
          one-off.
    - alert: WgfleetClientUDPBlackHole
      # mihomo's TPROXY reply path binds the SERVER's address:port to send a reply
      # back with the right source. Any UDP port this host already holds a socket
      # on therefore cannot get one — the bind fails with EADDRINUSE and every
      # reply packet is dropped inside mihomo, silently. Clients see requests leave
      # and nothing return, which reads as video stalling and apps hanging on
      # "connecting", not as an outage.
      #
      # Firing only on ports we have NOT decided about is what keeps this alert
      # meaningful: the ones we know about carry udp_return_known=1 and are listed
      # in the agent with a reason. This goes off when a NEW service binds a UDP
      # port and breaks client traffic to it — a class of failure that can run for
      # days with every other metric green.
      expr: wgfleet_agent_udp_return_socket == 0 and on(node, port) wgfleet_agent_udp_return_known == 0
      for: 30m
      labels:
        # Warning, not critical, and the reason is worth stating: on a master that
        # still intercepts client traffic in the host namespace this condition is
        # TRUE and STANDING for every port the host holds — that is the finding,
        # not an incident. A standing critical is a pager that gets silenced, and a
        # silenced pager is how the next real one is missed. The user-visible
        # outage has its own critical alert (WgfleetClientPathDead); this one names
        # the cause and does not stop naming it until the cause is gone.
        severity: warning
        service: wgfleet
      annotations:
        summary: "client UDP to port {{ $labels.port }} black-holes on {{ $labels.node }}"
        description: >-
          A socket this node holds makes it impossible for mihomo to open a
          transparent reply socket for destination port {{ $labels.port }}, and no
          rule refuses that traffic. Client flows to that port send and never
          receive. Find the holder with `ss -lunp | grep :{{ $labels.port }}`.
          The durable fix is moving client interception into mihomo's own network
          namespace, where the host's sockets are not in the way
          (`master.client_via_netns`); the local ones are to free the port or to
          refuse the traffic, which makes netfw.RefusedUDPPorts report it and
          clears this alert.
    - alert: WgfleetCAExpiringSoon
      # The CA is issued for ten years, so this fires once — and the one time it
      # does, it is the most important alert in the file. Every node certificate
      # chains to it: when it lapses they all become untrusted in the same instant,
      # and the control plane that would have renewed them is the thing that broke.
      # 90 days is chosen to be re-issuable calmly, not urgently.
      expr: (wgfleet_controller_ca_expiry_timestamp_seconds - time()) < 90 * 24 * 3600
      for: 1h
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Fleet CA expires in {{ $value | humanizeDuration }}
        description: Every node certificate chains to this CA. When it lapses the whole fleet falls off
          the control plane at once, and there is no channel left to repair it. Re-issue the CA and
          roll new node bundles before this date.
    - alert: WgfleetConfigUnreadable
      # The drift collector emits NOTHING when it cannot read the manifest, on
      # purpose. That silence needs its own alert, or a deleted controller.yaml
      # looks exactly like a healthy one.
      # Watch config_drift, not config_info: the collector emits config_info from
      # the digest it already holds in memory, BEFORE it tries to read the file, so
      # config_info survives exactly the failure this alert is named for. Only
      # config_drift goes absent when the manifest cannot be read.
      expr: absent(wgfleet_controller_config_drift)
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: The controller is not reporting which manifest it is running
        description: wgfleet_controller_config_info has been absent for 15m — either the controller is
          down, or it cannot read its own manifest and drift detection is blind.
    - alert: WgfleetASBlacklistEmpty
      # Absent is not zero, and the failure this names produces ABSENT. FWCollector
      # emits a per-family series only for sets it actually finds, so a reconciler
      # that stopped creating the set — exactly "abuse filtering is off" — yields
      # silence, and `== 0` could never fire. Measured on the stand: the exit's
      # `inet wgfleet` table exists and carries no blacklist set, and its /metrics has
      # no wgfleet_fw_as_blacklist_size at all. WgfleetNoClientPeers got an `or` arm
      # for precisely this and this rule did not.
      #
      # What this rule can and cannot see, stated plainly rather than implied:
      # it fires when the set EXISTS and is empty. It cannot fire when the set is
      # gone, because distinguishing "the reconciler stopped creating it" from
      # "firewall.as_blacklist is off for this exit" needs a series saying the
      # feature is enabled, and nothing publishes one yet. Until it does, an exit
      # that has lost the set entirely is invisible here.
      expr: wgfleet_fw_as_blacklist_size{family="v4"} == 0
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: AS blacklist is empty on {{ $labels.node }}
        description: The nftables AS blacklist ({{ $labels.family }}) on {{ $labels.node }} exists with 0
          entries — the feed probe is failing and abuse filtering is off.
    - alert: WgfleetGuardIsCatchingPackets
      # Two chains, two meanings, and only one of them is ever supposed to be zero.
      #
      # egress_path_guard asserts that no client packet leaves by a path nobody
      # chose. Nothing legitimate matches it, so ANY packet is news: it means client
      # traffic fell out of the namespace routing table and went for the uplink.
      #
      # egress_leak_guard asserts that no client address reaches the wire un-NATed,
      # and it catches a steady trickle by design: late FIN/ACK stragglers of
      # intercepted flows whose conntrack entry has aged out carry no NAT binding.
      # A few packets a minute is normal on a busy master with every check green.
      # Alerting on any increase
      # there would mean an alert that is always on, and an alert that is always on
      # is one that gets silenced.
      #
      # So: the path guard pages on a single packet, the leak guard only on a rate
      # far above that baseline.
      expr: increase(wgfleet_agent_guard_drops_packets{chain="egress_path_guard"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Client traffic took a path nobody chose on {{ $labels.node }}
        description: The egress_path_guard chain on {{ $labels.node }} dropped client packets — traffic
          left the namespace routing table for the uplink. Check that table 51822 still holds the veth
          route and its blackhole floor.
    - alert: WgfleetUnNATedClientTrafficRising
      # The leak guard's baseline is late TCP stragglers (see above). A rate an order
      # of magnitude above it means something else: a masquerade that stopped
      # matching, or a path that stopped being NATed at all.
      expr: increase(wgfleet_agent_guard_drops_packets{chain="egress_leak_guard"}[15m]) > 500
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Un-NATed client packets are rising on {{ $labels.node }}
        description: The egress_leak_guard chain on {{ $labels.node }} is dropping far more than the
          straggler baseline (~7/min). Something stopped being masqueraded — check the masquerade rule's
          scope against the client pool and the outgoing interface.
    - alert: WgfleetNodeCertExpiring
      # Node certificates are issued for a year and the agent renews its own between
      # 70% and 90% of that, in place, over the control plane. So this rule no longer
      # means "the anniversary is near" — it means RENEWAL IS FAILING, and has been
      # for at least 40 days by the time it fires: the node has been offline, or the
      # controller has no CA loaded, or its clock is wrong. 30 days is what is left
      # after the renewal window closes, which is also longer than any holiday.
      expr: (wgfleet_agent_cert_expiry_timestamp_seconds - time()) < 30 * 86400
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: mTLS certificate for {{ $labels.node }} expires in {{ $value | humanizeDuration }}
        description: The control-plane certificate for {{ $labels.node }} expires soon, which means its
          agent has failed to renew it for at least 40 days — check that the node is reachable and that
          the controller has a CA loaded. If it lapses the agent is refused and the node stops
          converging; recover it out of band with `wgfleet-controller --certs renew {{ $labels.node }}`.
    - alert: WgfleetNodeCertExpired
      expr: (wgfleet_agent_cert_expiry_timestamp_seconds - time()) < 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: mTLS certificate for {{ $labels.node }} has EXPIRED
        description: '{{ $labels.node }} can no longer authenticate to the controller, so it can no longer
          renew itself either — the renewal RPC needs the handshake the expiry has already closed. It is
          running its last-good configuration until a certificate is installed out of band
          (`wgfleet-controller --certs renew {{ $labels.node }}`, delivered over SSH).'
    - alert: WgfleetNodeCertRenewFailing
      # Renewal backs off to one attempt an hour, so a stuck node makes at least two
      # attempts in any 3h window. Firing here is months ahead of WgfleetNodeCertExpiring,
      # which only speaks once the renewal window has closed — this rule is the one that
      # fires while the node can still be reached over the channel it is about to lose.
      # Both result series exist from agent start, so `== 0` on the success side is a
      # real zero and not an absent series.
      expr: increase(wgfleet_agent_cert_renew_total{result="error"}[3h]) >= 2
        and ignoring(result) increase(wgfleet_agent_cert_renew_total{result="success"}[3h]) == 0
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: mTLS certificate renewal is failing on {{ $labels.node }}
        description: The agent on {{ $labels.node }} is due to renew its control-plane certificate and every
          attempt in the last 3 hours failed. It keeps authenticating with the current one until it expires.
          Read the reason in `journalctl -u wgfleet-agent | grep 'renewal failed'` — typically a controller
          with no CA loaded or below wire 10, or a wrong clock on the node.
    - alert: WgfleetNodeCertUnloadable
      # Latched on purpose: the counter lives as long as the agent process, and the
      # danger it names is the NEXT restart. A pair that failed to re-read once may
      # read fine the next time, but nobody should restart this agent before looking.
      # A restart clears it — and if the pair on disk is truly broken, that restart is
      # when the node leaves the control plane and WgfleetNodeReportStale takes over.
      expr: wgfleet_agent_cert_reload_errors_total > 0
      for: 0m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: '{{ $labels.node }} could not re-read its certificate and key from disk'
        description: The agent on {{ $labels.node }} failed to load its own certificate/key pair at a
          handshake ({{ $value }} times since it started) and is running on the pair it loaded at startup.
          The next restart may not be able to load the files at all. Before restarting it, read the error and
          the file paths in `journalctl -u wgfleet-agent | grep 'cannot re-read'` and check that the key matches
          the certificate (`openssl x509 -noout -pubkey -in <cert>` against `openssl pkey -pubout -in <key>`);
          if it does not, re-issue with `wgfleet-controller --certs renew --node {{ $labels.node }}`.
    - alert: WgfleetProbeStale
      # Guarded against the never-succeeded case: that probe reports a timestamp of 0
      # BY DESIGN, so an unguarded subtraction claims ~56 years of staleness, fires
      # within the hour and pre-empts WgfleetProbeNeverSucceeded, which is the rule
      # that actually describes what happened. README.md carried the correct form all
      # along; both shipped rule files carried the broken one.
      expr: time() - (wgfleet_probe_last_success_timestamp_seconds > 0) > 7 * 86400
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Scheduled probe '{{ $labels.probe }}' stale on {{ $labels.node }}
        description: Probe '{{ $labels.probe }}' on {{ $labels.node }} has not succeeded in over 7 days.
    - alert: WgfleetProbeNeverSucceeded
      expr: wgfleet_probe_last_attempt_timestamp_seconds > 0 unless wgfleet_probe_last_success_timestamp_seconds > 0
      for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Scheduled probe '{{ $labels.probe }}' has never succeeded on {{ $labels.node }}
        description: Probe '{{ $labels.probe }}' on {{ $labels.node }} has been attempted but never once
          succeeded.
  - name: wgfleet.host
    # Host metrics come from whichever exporter the node runs — the distro package
    # the bootstrap installs, or a build the operator put there — bound to the mgmt
    # overlay and adopted as-is by the agent's host planner (job wgfleet-node,
    # one target per node, labelled node/role like the agent job). Without that, only
    # nodes whose hoster happens to ship an exporter have these; the master — the
    # client entry point and the fleet's CPU bottleneck — may have none at all.
    rules:
    - alert: WgfleetHostMetricsMissing
      # A node the controller knows about that no node-exporter target is UP for.
      # Absence, not failure: a node provisioned before host metrics existed, or an
      # exporter that hit its start limit before the overlay address came up, looks
      # exactly like a node that is fine unless somebody asks this question.
      expr: |
        wgfleet_node_info{state!="Decommissioning"} == 1
          unless on(node) (up{job="wgfleet-node"} == 1)
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: No host metrics from {{ $labels.node }}
        description: The controller knows {{ $labels.node }} ({{ $labels.role }}) but no node-exporter target for it has been up for 30m. Check the exporter unit on the node (whichever one it runs) and that it is bound to the node's mgmt address on 9100; until then CPU, memory and disk on it are invisible.
    - alert: WgfleetHostDiskAlmostFull
      expr: |
        (node_filesystem_avail_bytes{job="wgfleet-node",mountpoint="/",fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{job="wgfleet-node",mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.10
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Root filesystem on {{ $labels.node }} below 10% free
        description: "{{ $labels.node }} has {{ $value | humanizePercentage }} of / left. Docker images, journald and the AS-blacklist cache all live there; a full root stops the reconcile from writing config and the containers from restarting."
    - alert: WgfleetHostMemoryPressure
      expr: |
        (node_memory_MemAvailable_bytes{job="wgfleet-node"} / node_memory_MemTotal_bytes{job="wgfleet-node"}) < 0.10
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: "{{ $labels.node }} has under 10% memory available"
        description: "{{ $labels.node }} has {{ $value | humanizePercentage }} of RAM available for 15m. The OOM killer picks the largest process, which on a master is mihomo — every client connection with it."
    - alert: WgfleetHostCPUSaturated
      # 1 vCPU boxes: the overlay alone is CPU-bound at 20-30 Mbit (ZeroTier is
      # single-threaded), so a saturated master is a throughput ceiling on every
      # client, not a box that is merely busy.
      expr: |
        (1 - avg by (node, role) (rate(node_cpu_seconds_total{job="wgfleet-node",mode="idle"}[10m]))) > 0.90
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: "{{ $labels.node }} CPU above 90% for 30m"
        description: "{{ $labels.node }} ({{ $labels.role }}) has been at {{ $value | humanizePercentage }} CPU for 30m. On a master this caps every client's throughput; on an exit it is usually WARP userspace crypto or a scanner storm at the firewall."
