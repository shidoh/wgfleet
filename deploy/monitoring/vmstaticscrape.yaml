# wgfleet — VictoriaMetrics Operator VMStaticScrape for the off-cluster fleet.
#
# The VictoriaMetrics equivalent of scrapeconfig.yaml: scrape the controller and
# agents (which expose /metrics only on their mgmt/ZeroTier address) as static
# targets. The vmagent must be able to reach the ZT addresses — join the cluster
# to the ZeroTier network, or route the ZT subnet to the vmagent pod.
#
# The vmagent picks this up only if it selects it: either set the vmagent's
#   spec.selectAllByDefault: true
# or label this resource to match the vmagent's
#   spec.staticScrapeSelector  (+ spec.staticScrapeNamespaceSelector for the ns).
#
# Apply:  kubectl apply -f vmstaticscrape.yaml
#
# You only edit the ZT addresses (and namespace + the selector label).
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: wgfleet
  namespace: monitoring # <-- your vmagent scrape namespace
  labels:
    # <-- match your VMAgent spec.staticScrapeSelector (drop if selectAllByDefault: true)
    app.kubernetes.io/name: wgfleet
spec:
  jobName: wgfleet
  targetEndpoints:
    # Controller — its ZT address, metrics port 9300 (controller.metrics).
    - targets:
        - 10.20.0.1:9300 # <-- EDIT: controller ZT address
      labels:
        component: controller
      path: /metrics
      scheme: http
      interval: 30s
    # Agents — one ZT address per node, metrics port 9301 (--metrics flag).
    - targets:
        - 10.20.0.1:9301 # master          <-- EDIT: node ZT addresses
        - 10.20.0.2:9301 # exit-1
        - 10.20.0.3:9301 # exit-2
        - 10.20.0.4:9301 # exit-3
      labels:
        component: agent
      path: /metrics
      scheme: http
      interval: 30s
