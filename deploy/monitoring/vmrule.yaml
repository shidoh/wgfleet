# wgfleet — alerting rules for VictoriaMetrics Operator (`VMRule`).
#
# Companion to `vmstaticscrape.yaml`: those rules assume the scrape jobs defined
# there (job="wgfleet", with component="controller"|"agent" target labels).
#
# Severity is either `warning` or `critical` — no `info`, because a lot of
# Alertmanager setups blackhole info by default. Retune `for:` to taste; the
# defaults assume the stock 30s agent report interval.
#
# The vmagent/vmalert picks this up only if it selects it: either the VMAlert has
#   spec.selectAllByDefault: true
# or label this resource to match its spec.ruleSelector (+ ruleNamespaceSelector).
#
# Apply:  kubectl apply -f vmrule.yaml
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: wgfleet
  labels:
    app.kubernetes.io/name: wgfleet
  namespace: monitoring
spec:
  groups:
  - name: wgfleet.scrape
    interval: 30s
    rules:
    - alert: WgfleetConfigDrift
      expr: wgfleet_controller_config_drift == 1
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: the manifest on disk differs from the one the controller is running
        description: Someone edited controller.yaml and the change has not been applied — or was
          applied on a different host. The controller keeps serving the configuration it loaded at
          startup, so the edit has no effect and nothing else will say so. Run
          `wgfleet-controller --check-config` and then restart the controller.
    - alert: WgfleetControllerDown
      expr: up{job="wgfleet",component="controller"} == 0
      for: 3m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: wgfleet controller /metrics is unreachable
        description: The controller at {{ $labels.instance }} has not been scrapeable for 3m. The whole
          fleet is flying blind and no node can re-register.
    - alert: WgfleetAgentScrapeDown
      expr: up{job="wgfleet",component="agent"} == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'wgfleet agent /metrics unreachable: {{ $labels.instance }}'
        description: Agent metrics at {{ $labels.instance }} have been down for 10m. Either the agent
          is dead, or the mgmt overlay (ZeroTier) path to it is broken.
    - alert: WgfleetAgentUnscraped
      # `or vector(0)` because count() over an empty set returns no series, not 0:
      # with EVERY agent down the subtraction yielded nothing and the total-outage
      # case — the one that matters most — was the one case this could not report.
      # The same fix was applied to WgfleetNoReadyExit and missed here.
      # Fails open on a missing gauge — see WgfleetNoReadyExit for why.
      expr: (max(wgfleet_nodes{state="Ready"}) - (count(up{job="wgfleet",component="agent"} == 1) or vector(0)) > 0)
        unless on() (wgfleet_controller_store_up == 0)
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Fleet has more Ready nodes than scraped agents
        description: '{{ $value }} node(s) are Ready in the controller store but have no agent target
          in the wgfleet job. Add their mgmt addresses to the VMStaticScrape.'
  - name: wgfleet.fleet
    interval: 30s
    rules:
    - alert: WgfleetNodeReportStale
      expr: wgfleet_node_last_report_age_seconds > 180
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} stopped reporting to the controller
        description: Last report from {{ $labels.node }} was {{ $value | humanizeDuration }} ago. The
          control channel is down (gRPC/mTLS, or MTU blackhole on the mgmt overlay).
    - alert: WgfleetNodeError
      expr: wgfleet_node_info{state="Error"} == 1
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} is in Error state
        description: Node {{ $labels.node }} ({{ $labels.role }}) has been in state Error for 5m.
    - alert: WgfleetNodeNotReady
      expr: wgfleet_node_info{state=~"Degraded|Pending|Provisioning|Reconciling"} == 1
      for: 20m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} stuck in {{ $labels.state }}
        description: Node {{ $labels.node }} ({{ $labels.role }}) has not reached Ready for 20m.
    - alert: WgfleetNodeReconcileFailed
      expr: wgfleet_node_reconcile_failed == 1
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Reconcile failing on {{ $labels.node }}
        description: The controller reports {{ $labels.node }} as reconcile-failed for 15m — the desired
          manifest is not being applied.
    - alert: WgfleetNodeDrainedTooLong
      expr: wgfleet_node_drain == 1
      for: 24h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} has been drained for 24h
        description: Drain is meant to be temporary (mihomo hot-reload / maintenance). {{ $labels.node
          }} has been out of rotation for a day — undrain it or decommission it.
    - alert: WgfleetNoReadyExit
      # `or vector(0)` is load-bearing: with no Ready exit the inner selector is
      # empty, count() returns no series at all, and the comparison it feeds can
      # never be true — the alert was silent in the exact condition it names.
      # Suppressed only when the store EXPLICITLY reports itself unreadable: an
      # unreadable store emits no node series, which is indistinguishable from an
      # empty fleet — this paged "every exit is out of rotation" for a locked SQLite
      # file while the data plane ran fine.
      #
      # `unless … == 0` and not `and … == 1` on purpose. The gauge is new; with `and`
      # the whole expression is empty until every controller publishes it, so
      # applying these rules before the binary would turn this critical alert OFF
      # rather than merely quieten it — a deployment-order trap with no signal. This
      # form fails OPEN: no gauge means no suppression, and the alert behaves exactly
      # as it did before.
      expr: ((count(wgfleet_node_info{role="exit",state="Ready"} == 1) or vector(0)) < 1)
        unless on() (wgfleet_controller_store_up == 0)
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No Ready exit node left in the fleet
        description: Every exit is out of rotation. Client traffic has nowhere to egress.
  - name: wgfleet.health
    interval: 30s
    rules:
    - alert: WgfleetHealthCheckFailing
      expr: wgfleet_node_health_check == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Health check {{ $labels.check }} failing on {{ $labels.node }}
        description: Check '{{ $labels.check }}' on node {{ $labels.node }} has been failing for 10m.
    - alert: WgfleetClientPathDown
      # client-wg.* rather than client-wg: the check that reports whether the AGENT
      # is carrying the client interface is named client-wg-owned, and a Prometheus
      # regexp is fully anchored, so the narrower pattern excluded it — leaving the
      # one signal for "the client leg is not ours" to fall through to the generic
      # 10-minute warning below.
      expr: wgfleet_node_health_check{check=~"client-wg.*|client-vless"} == 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: 'Client entry point down on {{ $labels.node }}: {{ $labels.check }}'
        description: The client-facing inbound '{{ $labels.check }}' on master {{ $labels.node }} has
          been failing for 5m. New clients cannot connect.
    # wgfleet_agent_egress_reachability and _egress_active are INFO gauges: the
    # agent calls Reset() then Set(1) on the label that is currently true, so the
    # value is always 1 and never 0. Both of these alerted on `== 0` and therefore
    # could not fire — one of them at severity: critical. The state lives in the
    # LABEL, so that is what these match on now.
    # Both of these can only fire on an exit running WARP. EgressClassifier returns
    # no class unless a `warp-egress` health check is present, and ObserveEgress
    # no-ops on an empty one — so an exit with `egress: direct` publishes no
    # reachability series and neither rule can ever fire for it. That is correct for
    # a WARP-reachability probe and misleading as a fleet-wide guarantee: on a
    # direct-egress fleet the critical "your users' traffic is blackholed" signal
    # does not exist, and the dashboard's Egress panel shows No data rather than 0.
    - alert: WgfleetWARPEgressBlocked
      expr: wgfleet_agent_egress_reachability{state="blocked"} == 1
      for: 10m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: WARP egress blocked on exit {{ $labels.node }}
        description: 'Exit {{ $labels.node }} classifies its WARP egress as blocked. Traffic routed to
          this exit is blackholed. Only exits running WARP publish this; an exit on direct egress
          cannot raise it.'
    - alert: WgfleetWARPEgressDegraded
      expr: wgfleet_agent_egress_reachability{state="degraded"} == 1
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: WARP egress degraded on exit {{ $labels.node }}
        description: Exit {{ $labels.node }} has been running on a degraded WARP egress path for 30m.
          Only exits running WARP publish this.
  - name: wgfleet.reconcile
    interval: 30s
    rules:
    - alert: WgfleetReconcileErrors
      # One failed pass out of thirty held this true for the entire 15m window, so
      # the 5m `for:` was met by construction: a single RPC timeout on a flaky link
      # paged, and the agent had already self-healed by the time anyone looked. What
      # matters is not converging — hence the second clause, which is what separates
      # "wobbling but recovering" from "stuck".
      # `ignoring(result)` is load-bearing and its absence made this rule DEAD: the
      # counter carries a `result` label, so the left side is result="error" and the
      # right is result="success". A bare `and` matches on every label including that
      # one, the signatures never line up, and the whole expression is empty — off,
      # not quieter, in exactly the not-converging case it exists for.
      expr: increase(wgfleet_agent_reconcile_total{result!="success"}[30m]) > 5
        and ignoring(result) increase(wgfleet_agent_reconcile_total{result="success"}[30m]) == 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Agent reconcile errors on {{ $labels.node }}
        description: '{{ $value | printf "%.0f" }} failed reconcile pass(es) in the last 30m, with none succeeding, on {{ $labels.node
          }} (result={{ $labels.result }}).'
    - alert: WgfleetPersistentDrift
      expr: increase(wgfleet_agent_drift_total[1h]) > 10
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Config drift keeps recurring on {{ $labels.node }}
        description: Component '{{ $labels.exported_component }}' on {{ $labels.node }} drifted {{ $value
          | printf "%.0f" }} times in an hour — something else is fighting the agent for that resource.
    - alert: WgfleetAgentFlapping
      expr: changes(wgfleet_agent_start_time_seconds[1h]) > 3
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: wgfleet-agent restarting repeatedly on {{ $labels.node }}
        description: The agent on {{ $labels.node }} restarted {{ $value | printf "%.0f" }} times in the
          last hour.
  - name: wgfleet.versions
    interval: 1m
    rules:
    - alert: WgfleetWireVersionSkew
      expr: count(count by (wire_version) (wgfleet_node_agent_info)) > 1
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Agents disagree on control-plane wire version
        description: More than one wire_version is live in the fleet for 30m. A rollout is stuck half-applied.
    - alert: WgfleetAgentVersionSkew
      expr: count(count by (agent_version) (wgfleet_node_agent_info)) > 1
      for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Fleet is running mixed agent versions
        description: More than one agent_version has been live for 6h — a rollout was never finished.
  - name: wgfleet.rotation
    interval: 30s
    rules:
    # The master↔exit tunnels are userspace mihomo proxies, not kernel WireGuard,
    # so no wg_* series covers them and nothing here watched them at all. On
    # 2026-09-04 three exits had been dropping out of the load balancer for two
    # weeks — 27 recorded verdicts — and the only record was the master agent's
    # journal. These rules exist so that never has to be reconstructed by hand
    # again.
    - alert: WgfleetExitOutOfRotation
      # Two health criteria write mihomo's alive flag: its own group check (one
      # lightweight URL) and the master agent's multi-destination probe. When this
      # fires, wgfleet_agent_exit_held_out{exit=...} says which one did it — 1 means
      # our stricter probe took the exit out, i.e. it could not reach enough
      # independent destinations, the censored-but-"healthy" signature.
      # Scoped to the tier that actually carries traffic. A dual-transport exit
      # renders BOTH an AWG and a "<exit>-reality" proxy, but only one of them is in
      # a group — the other is configured, routed through by nobody, and never
      # probed, so its alive/age readings drift forever. Live check the hour this
      # rule was written: 1cnode004's AWG proxy sat alive=0 with a 55-minute-old
      # measurement while its reality proxy was fresh, i.e. this alert would have
      # paged permanently on a tunnel with no traffic on it by design.
      #
      # wgfleet_agent_exit_held_out enumerates exactly the active tier's members, so
      # it is the gate. The coupling is deliberate but worth knowing: it comes from
      # the master AGENT scrape while the gated series comes from the CONTROLLER, so
      # if the agent stops being scraped these go quiet — WgfleetAgentScrapeDown is
      # what covers that.
      expr: wgfleet_exit_tunnel_alive == 0 and on(exit) wgfleet_agent_exit_held_out
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Exit {{ $labels.exit }} is out of the load balancer on {{ $labels.node }}
        description: mihomo on {{ $labels.node }} has {{ $labels.exit }} marked down, so wg-best is
          not routing client traffic to it. Check wgfleet_agent_exit_held_out{exit="{{ $labels.exit }}"}
          to tell our multi-destination verdict from mihomo's own check.
    - alert: WgfleetNoExitInRotation
      # `or vector(0)` makes the empty case reachable, exactly as in
      # WgfleetNoReadyExit — count() over an empty selector returns no series, so
      # without it the comparison can never be true in the condition it names.
      #
      # The `and on() (count(...) > 0)` guard is the other half, and it is NOT
      # symmetric with that alert: these series are brand new, so before the
      # controller carrying them is deployed the selector is empty for a reason that
      # has nothing to do with the data plane — and `or vector(0)` alone would page
      # critical on every fleet that has not upgraded yet. Requiring the family to
      # exist makes the rule silent until it has real data, which for a new alert is
      # the right way round; WgfleetNoReadyExit still covers the same outage.
      expr: ((count(wgfleet_exit_tunnel_alive == 1 and on(exit) wgfleet_agent_exit_held_out) or vector(0)) < 1)
        and on() (count(wgfleet_agent_exit_held_out) > 0)
        unless on() (wgfleet_controller_store_up == 0)
      for: 2m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No exit left in the master's load balancer
        description: Every master↔exit tunnel is marked down. Client traffic has nothing to egress
          through even though the exits themselves may be Ready.
    - alert: WgfleetExitTunnelHealthStale
      # mihomo's alive flag is STICKY: it holds whatever the last probe wrote. A
      # master that stopped probing therefore reports every tunnel confidently alive
      # forever, and WgfleetExitOutOfRotation above goes quiet for the best possible
      # reason and the worst possible cause. The age is what separates a fresh
      # reading from a frozen one.
      # Same active-tier gate as WgfleetExitOutOfRotation, for the same reason: an
      # unrouted standby-transport proxy is never probed, so its age grows without
      # bound and means nothing.
      expr: wgfleet_exit_tunnel_last_test_age_seconds > 300 and on(exit) wgfleet_agent_exit_held_out
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Tunnel health for {{ $labels.exit }} is frozen on {{ $labels.node }}
        description: The last delay measurement of {{ $labels.exit }} is {{ $value | humanizeDuration }}
          old, so its alive/selected state is stale rather than healthy. The master's mihomo probe or
          its Clash API has stopped answering.
    - alert: WgfleetReserveTierActive
      # Not an outage — the failover worked — but the fleet is running on the tier
      # it keeps for emergencies, and nothing else says so out loud.
      expr: wgfleet_agent_reserve_tier_active == 1
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: '{{ $labels.node }} is routing through the RESERVE exit tier'
        description: Every primary exit failed the multi-destination probe, so wg-best failed over
          to the second-choice tier. Client traffic is served, but there is nothing left to fail
          over to.
    - alert: WgfleetStandbyTierUnusable
      # The half of a failover decision that is normally invisible: not "is the
      # active tier dying" but "can the tier we would move every client onto reach
      # the internet at all". total == 0 means it was never sampled, which is a
      # different fault and is left to WgfleetExitTunnelHealthStale.
      expr: wgfleet_agent_standby_tier_total > 0 and wgfleet_agent_standby_tier_usable == 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: The standby exit tier on {{ $labels.node }} has no usable member
        description: The warm probe found no reachable exit in the INACTIVE tier. A failover right
          now would land every client on a tier that cannot reach the internet.
    - alert: WgfleetStandbyTransportUnusable
      # A dual-transport exit keeps its inactive transport configured but out of
      # the load-balance group, so nothing dials it and — until the probe behind
      # this rule existed — nothing knew whether it worked. Measured on the live
      # fleet 2026-09-04: five of six exits had a standby transport, none had ever
      # been health-checked, and four of them reported mihomo's untested default
      # of alive=1. A confident green on no evidence.
      #
      # This is not an outage: the exit is serving over its active transport. It is
      # a MISSING FALLBACK, and the switch that needs it is an emergency move made
      # exactly when the active path has been blocked — the worst moment to find
      # out the other one is dead too. Warning, not critical, for that reason.
      #
      # No active-tier gate here (unlike the rotation alerts): the standby is out of
      # rotation BY DESIGN, so gating on rotation membership would silence the rule
      # in every case it exists for. The series is only emitted for an exit that
      # actually has a standby, which is the scoping this needs.
      expr: wgfleet_agent_standby_transport_usable == 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'Exit {{ $labels.exit }} has no working fallback: its {{ $labels.transport }} standby is unusable'
        description: The standby {{ $labels.transport }} transport on {{ $labels.exit }} could not reach
          enough independent destinations. The exit is still serving over its active transport, but
          switching it over would not restore anything — so it currently has no fallback.
  - name: wgfleet.dataplane
    interval: 1m
    rules:
    - alert: WgfleetWireGuardHandshakeStale
      # wg0 is EXCLUDED: it is the client-facing interface, where a stale handshake
      # is a phone in a pocket, not a fault. Left in, this fired once per sleeping
      # device and buried the tunnel peers it exists to watch. Mass client loss is
      # covered by WgfleetNoClientPeers below, which looks at the count instead.
      expr: wgfleet_wg_handshake_age_seconds{iface!="wg0"} > 300
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Stale WireGuard handshake on {{ $labels.node }}/{{ $labels.iface }}
        description: Peer {{ $labels.peer }} on {{ $labels.iface }} ({{ $labels.node }}) last handshook
          {{ $value | humanizeDuration }} ago.
    - alert: WgfleetNoClientPeers
      # The single best signal that end users have lost the fleet: the client
      # interface is up and authenticating nobody. Nothing watched this, so a
      # handover that raised an empty interface — or a client leg that came back
      # without its peers — was visible only as people complaining.
      # The `or` arm is load-bearing. For as long as this rule existed the series
      # it watches was emitted by NOBODY — the collector shelled to `wg show` on
      # nodes that only have `awg` — so the alert could not fire, and its silence
      # read exactly like health. An absent series must be the loudest case here,
      # not the quietest.
      # Split, because the two halves are not the same event. A collector that
      # cannot read the interface is unambiguous and stays critical. Zero peers is
      # NOT: peers_active counts handshakes inside a 3-minute window, so a laptop
      # asleep and a phone with the tunnel off is a genuine, correct zero for hours.
      # As written this paged critical most nights, which is how a channel stops
      # being read. Requiring that the interface HAD peers in the last 24h keeps the
      # collapse case (they were here, now none are) and drops the quiet night: a
      # window shorter than a day would let a weekend of no traffic read as recovery.
      #
      # The collector-down arm is NOT the same event and stays unconditional — with
      # one caveat: WGCollector reports collector_up=0 for an interface it cannot
      # dump, and a master that does not run the client leg has no wg0 at all, so
      # that master pages this forever. Until the collector distinguishes "absent"
      # from "unreadable", drop this rule for a fleet mid-migration.
      expr: (wgfleet_wg_collector_up{iface="wg0"} == 0)
        or (wgfleet_wg_peers_active{iface="wg0"} == 0
            and max_over_time(wgfleet_wg_peers_active{iface="wg0"}[24h]) > 0)
      for: 10m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No client has a live handshake on {{ $labels.node }}
        description: The client-facing interface on {{ $labels.node }} has had zero active peers for
          10m. Either every client is offline at once, or the interface is serving an empty peer set.
    - alert: WgfleetClientPathDead
      # The master's own client cannot get traffic through the path its users take.
      # This is the only alert that measures the whole sentence rather than a
      # component: during the eight days client QUIC was dead in August 2026, the
      # master<->exit link was at 0% loss, exit egress at 30 MB/s, every proxy alive
      # and no unit failed — because each of those measured a component and every
      # component was fine.
      expr: wgfleet_agent_client_path_ok == 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: "the client path is dead for {{ $labels.probe }} on {{ $labels.node }}"
        description: >-
          The master's own synthetic client could not complete a
          {{ $labels.probe }} exchange through the client interface, the firewall,
          mihomo and an exit. Real clients take the same path. Reproduce with
          `ip netns exec wgfleet-synth curl -v https://cp.cloudflare.com/generate_204`
          on the master.
    - alert: WgfleetMihomoComplaining
      # mihomo writes its own failures to the container log and nothing read them.
      # The TPROXY reply failure that killed every client QUIC flow from 2026-08-28
      # announced itself 97787 times over eight days while every other metric stayed
      # green. Deliberately unclassified: the next failure of this class will carry a
      # different message, and what generalises is that the data plane is complaining.
      expr: rate(wgfleet_agent_mihomo_errors_total[15m]) > 0
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: "mihomo is logging errors on {{ $labels.node }}"
        description: >-
          mihomo has been writing error lines steadily for 15 minutes. Read them
          with `docker logs mihomo --since 15m | grep level=error`. A steady rate
          usually means a per-packet or per-connection failure rather than a
          one-off.
    - alert: WgfleetClientUDPBlackHole
      # mihomo's TPROXY reply path binds the SERVER's address:port to send a reply
      # back with the right source. Any UDP port this host already holds a socket
      # on therefore cannot get one — the bind fails with EADDRINUSE and every
      # reply packet is dropped inside mihomo, silently. Clients see requests leave
      # and nothing return, which reads as video stalling and apps hanging on
      # "connecting", not as an outage.
      #
      # Firing only on ports we have NOT decided about is what keeps this alert
      # meaningful: the ones we know about carry udp_return_known=1 and are listed
      # in the agent with a reason. This goes off when a NEW service binds a UDP
      # port and breaks client traffic to it — the class of failure that ran for
      # eight days on the live master in August 2026 with every other metric green.
      expr: wgfleet_agent_udp_return_socket == 0 and on(node, port) wgfleet_agent_udp_return_known == 0
      for: 30m
      labels:
        # Warning, not critical, and the reason is worth stating: on a master that
        # still intercepts client traffic in the host namespace this condition is
        # TRUE and STANDING for every port the host holds — that is the finding,
        # not an incident. A standing critical is a pager that gets silenced, and a
        # silenced pager is how the next real one is missed. The user-visible
        # outage has its own critical alert (WgfleetClientPathDead); this one names
        # the cause and does not stop naming it until the cause is gone.
        severity: warning
        service: wgfleet
      annotations:
        summary: "client UDP to port {{ $labels.port }} black-holes on {{ $labels.node }}"
        description: >-
          A socket this node holds makes it impossible for mihomo to open a
          transparent reply socket for destination port {{ $labels.port }}, and no
          rule refuses that traffic. Client flows to that port send and never
          receive. Find the holder with `ss -lunp | grep :{{ $labels.port }}`.
          The durable fix is moving client interception into mihomo's own network
          namespace, where the host's sockets are not in the way
          (`master.client_via_netns`); the local ones are to free the port or to
          refuse the traffic, which makes netfw.RefusedUDPPorts report it and
          clears this alert.
    - alert: WgfleetCAExpiringSoon
      # The CA is issued for ten years, so this fires once — and the one time it
      # does, it is the most important alert in the file. Every node certificate
      # chains to it: when it lapses they all become untrusted in the same instant,
      # and the control plane that would have renewed them is the thing that broke.
      # 90 days is chosen to be re-issuable calmly, not urgently.
      expr: (wgfleet_controller_ca_expiry_timestamp_seconds - time()) < 90 * 24 * 3600
      for: 1h
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Fleet CA expires in {{ $value | humanizeDuration }}
        description: Every node certificate chains to this CA. When it lapses the whole fleet falls off
          the control plane at once, and there is no channel left to repair it. Re-issue the CA and
          roll new node bundles before this date.
    - alert: WgfleetConfigUnreadable
      # The drift collector emits NOTHING when it cannot read the manifest, on
      # purpose — reporting 0 would assert "in sync" about a file nobody could
      # open. That silence needs its own alert, or a deleted or chmod-broken
      # controller.yaml looks exactly like a healthy one.
      # Watch config_drift, not config_info: the collector emits config_info from
      # the digest it already holds in memory, BEFORE it tries to read the file, so
      # config_info survives exactly the failure this alert is named for. Only
      # config_drift goes absent when the manifest cannot be read.
      expr: absent(wgfleet_controller_config_drift)
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: The controller is not reporting which manifest it is running
        description: wgfleet_controller_config_info has been absent for 15m — either the controller is
          down, or it cannot read its own manifest and drift detection is blind.
    - alert: WgfleetASBlacklistEmpty
      # Absent is not zero, and the failure this names produces ABSENT. FWCollector
      # emits a per-family series only for sets it actually finds, so a reconciler
      # that stopped creating the set — exactly "abuse filtering is off" — yields
      # silence, and `== 0` could never fire. Measured on the stand: the exit's
      # `inet wgfleet` table exists and carries no blacklist set, and its /metrics has
      # no wgfleet_fw_as_blacklist_size at all. WgfleetNoClientPeers got an `or` arm
      # for precisely this and this rule did not.
      #
      # What this rule can and cannot see, stated plainly rather than implied:
      # it fires when the set EXISTS and is empty. It cannot fire when the set is
      # gone, because distinguishing "the reconciler stopped creating it" from
      # "firewall.as_blacklist is off for this exit" needs a series saying the
      # feature is enabled, and nothing publishes one yet. Until it does, an exit
      # that has lost the set entirely is invisible here.
      expr: wgfleet_fw_as_blacklist_size{family="v4"} == 0
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: AS blacklist is empty on {{ $labels.node }}
        description: The nftables AS blacklist ({{ $labels.family }}) on {{ $labels.node }} exists with 0
          entries — the feed probe is failing and abuse filtering is off.
    - alert: WgfleetGuardIsCatchingPackets
      # Two chains, two meanings, and only one of them is ever supposed to be zero.
      #
      # egress_path_guard asserts that no client packet leaves by a path nobody
      # chose. Nothing legitimate matches it, so ANY packet is news: it means client
      # traffic fell out of the namespace routing table and went for the uplink.
      #
      # egress_leak_guard asserts that no client address reaches the wire un-NATed,
      # and it catches a steady trickle by design: late FIN/ACK stragglers of
      # intercepted flows whose conntrack entry has aged out carry no NAT binding.
      # Measured on the live master 2026-09-06 — about 7 packets a minute against
      # 569 concurrent client flows, with every check green. Alerting on any increase
      # there would mean an alert that is always on, and an alert that is always on
      # is one that gets silenced.
      #
      # So: the path guard pages on a single packet, the leak guard only on a rate
      # far above that baseline.
      expr: increase(wgfleet_agent_guard_drops_packets{chain="egress_path_guard"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Client traffic took a path nobody chose on {{ $labels.node }}
        description: The egress_path_guard chain on {{ $labels.node }} dropped client packets — traffic
          left the namespace routing table for the uplink. Check that table 51822 still holds the veth
          route and its blackhole floor.
    - alert: WgfleetUnNATedClientTrafficRising
      # The leak guard's baseline is late TCP stragglers (see above). A rate an order
      # of magnitude above it means something else: a masquerade that stopped
      # matching, or a path that stopped being NATed at all.
      expr: increase(wgfleet_agent_guard_drops_packets{chain="egress_leak_guard"}[15m]) > 500
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Un-NATed client packets are rising on {{ $labels.node }}
        description: The egress_leak_guard chain on {{ $labels.node }} is dropping far more than the
          straggler baseline (~7/min). Something stopped being masqueraded — check the masquerade rule's
          scope against the client pool and the outgoing interface.
    - alert: WgfleetNodeCertExpiring
      # Node certificates are issued for a year and the agent renews its own between
      # 70% and 90% of that, in place, over the control plane. So this rule no longer
      # means "the anniversary is near" — it means RENEWAL IS FAILING, and has been
      # for at least 40 days by the time it fires: the node has been offline, or the
      # controller has no CA loaded, or its clock is wrong. 30 days is what is left
      # after the renewal window closes, which is also longer than any holiday.
      expr: (wgfleet_agent_cert_expiry_timestamp_seconds - time()) < 30 * 86400
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: mTLS certificate for {{ $labels.node }} expires in {{ $value | humanizeDuration }}
        description: The control-plane certificate for {{ $labels.node }} expires soon, which means its
          agent has failed to renew it for at least 40 days — check that the node is reachable and that
          the controller has a CA loaded. If it lapses the agent is refused and the node stops
          converging; recover it out of band with `wgfleet-controller --certs renew {{ $labels.node }}`.
    - alert: WgfleetNodeCertExpired
      expr: (wgfleet_agent_cert_expiry_timestamp_seconds - time()) < 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: mTLS certificate for {{ $labels.node }} has EXPIRED
        description: '{{ $labels.node }} can no longer authenticate to the controller, so it can no longer
          renew itself either — the renewal RPC needs the handshake the expiry has already closed. It is
          running its last-good configuration until a certificate is installed out of band
          (`wgfleet-controller --certs renew {{ $labels.node }}`, delivered over SSH).'
    - alert: WgfleetProbeStale
      # Guarded against the never-succeeded case: that probe reports a timestamp of 0
      # BY DESIGN, so an unguarded subtraction claims ~56 years of staleness, fires
      # within the hour and pre-empts WgfleetProbeNeverSucceeded, which is the rule
      # that actually describes what happened. README.md carried the correct form all
      # along; both shipped rule files carried the broken one.
      expr: time() - (wgfleet_probe_last_success_timestamp_seconds > 0) > 7 * 86400
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Scheduled probe '{{ $labels.probe }}' stale on {{ $labels.node }}
        description: Probe '{{ $labels.probe }}' on {{ $labels.node }} has not succeeded in over 7 days.
    - alert: WgfleetProbeNeverSucceeded
      expr: wgfleet_probe_last_attempt_timestamp_seconds > 0 unless wgfleet_probe_last_success_timestamp_seconds > 0
      for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Scheduled probe '{{ $labels.probe }}' has never succeeded on {{ $labels.node }}
        description: Probe '{{ $labels.probe }}' on {{ $labels.node }} has been attempted but never once
          succeeded.
