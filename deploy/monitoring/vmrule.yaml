# wgfleet — alerting rules for VictoriaMetrics Operator (`VMRule`).
#
# Companion to `vmstaticscrape.yaml`: those rules assume the scrape jobs defined
# there (job="wgfleet", with component="controller"|"agent" target labels).
#
# Severity is either `warning` or `critical` — no `info`, because a lot of
# Alertmanager setups blackhole info by default. Retune `for:` to taste; the
# defaults assume the stock 30s agent report interval.
#
# The vmagent/vmalert picks this up only if it selects it: either the VMAlert has
#   spec.selectAllByDefault: true
# or label this resource to match its spec.ruleSelector (+ ruleNamespaceSelector).
#
# Apply:  kubectl apply -f vmrule.yaml
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: wgfleet
  labels:
    app.kubernetes.io/name: wgfleet
  namespace: monitoring
spec:
  groups:
  - name: wgfleet.scrape
    interval: 30s
    rules:
    - alert: WgfleetConfigDrift
      expr: wgfleet_controller_config_drift == 1
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: the manifest on disk differs from the one the controller is running
        description: Someone edited controller.yaml and the change has not been applied — or was
          applied on a different host. The controller keeps serving the configuration it loaded at
          startup, so the edit has no effect and nothing else will say so. Run
          `wgfleet-controller --check-config` and then restart the controller.
    - alert: WgfleetControllerDown
      expr: up{job="wgfleet",component="controller"} == 0
      for: 3m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: wgfleet controller /metrics is unreachable
        description: The controller at {{ $labels.instance }} has not been scrapeable for 3m. The whole
          fleet is flying blind and no node can re-register.
    - alert: WgfleetAgentScrapeDown
      expr: up{job="wgfleet",component="agent"} == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: 'wgfleet agent /metrics unreachable: {{ $labels.instance }}'
        description: Agent metrics at {{ $labels.instance }} have been down for 10m. Either the agent
          is dead, or the mgmt overlay (ZeroTier) path to it is broken.
    - alert: WgfleetAgentUnscraped
      # `or vector(0)` because count() over an empty set returns no series, not 0:
      # with EVERY agent down the subtraction yielded nothing and the total-outage
      # case — the one that matters most — was the one case this could not report.
      # The same fix was applied to WgfleetNoReadyExit and missed here.
      expr: (max(wgfleet_nodes{state="Ready"}) - (count(up{job="wgfleet",component="agent"} == 1) or vector(0)) > 0)
        and on() (wgfleet_controller_store_up == 1)
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Fleet has more Ready nodes than scraped agents
        description: '{{ $value }} node(s) are Ready in the controller store but have no agent target
          in the wgfleet job. Add their mgmt addresses to the VMStaticScrape.'
  - name: wgfleet.fleet
    interval: 30s
    rules:
    - alert: WgfleetNodeReportStale
      expr: wgfleet_node_last_report_age_seconds > 180
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} stopped reporting to the controller
        description: Last report from {{ $labels.node }} was {{ $value | humanizeDuration }} ago. The
          control channel is down (gRPC/mTLS, or MTU blackhole on the mgmt overlay).
    - alert: WgfleetNodeError
      expr: wgfleet_node_info{state="Error"} == 1
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} is in Error state
        description: Node {{ $labels.node }} ({{ $labels.role }}) has been in state Error for 5m.
    - alert: WgfleetNodeNotReady
      expr: wgfleet_node_info{state=~"Degraded|Pending|Provisioning|Reconciling"} == 1
      for: 20m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} stuck in {{ $labels.state }}
        description: Node {{ $labels.node }} ({{ $labels.role }}) has not reached Ready for 20m.
    - alert: WgfleetNodeReconcileFailed
      expr: wgfleet_node_reconcile_failed == 1
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Reconcile failing on {{ $labels.node }}
        description: The controller reports {{ $labels.node }} as reconcile-failed for 15m — the desired
          manifest is not being applied.
    - alert: WgfleetNodeDrainedTooLong
      expr: wgfleet_node_drain == 1
      for: 24h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Node {{ $labels.node }} has been drained for 24h
        description: Drain is meant to be temporary (mihomo hot-reload / maintenance). {{ $labels.node
          }} has been out of rotation for a day — undrain it or decommission it.
    - alert: WgfleetNoReadyExit
      # `or vector(0)` is load-bearing: with no Ready exit the inner selector is
      # empty, count() returns no series at all, and the comparison it feeds can
      # never be true — the alert was silent in the exact condition it names.
      # Gated on store_up: an unreadable store emits no node series, which is
      # indistinguishable from an empty fleet — this paged "every exit is out of
      # rotation" for a locked SQLite file while the data plane ran fine. The gate
      # also silences it when the controller is down (WgfleetControllerDown owns
      # that), so one outage stops producing three pages, one of them false.
      expr: ((count(wgfleet_node_info{role="exit",state="Ready"} == 1) or vector(0)) < 1)
        and on() (wgfleet_controller_store_up == 1)
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No Ready exit node left in the fleet
        description: Every exit is out of rotation. Client traffic has nowhere to egress.
  - name: wgfleet.health
    interval: 30s
    rules:
    - alert: WgfleetHealthCheckFailing
      expr: wgfleet_node_health_check == 0
      for: 10m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Health check {{ $labels.check }} failing on {{ $labels.node }}
        description: Check '{{ $labels.check }}' on node {{ $labels.node }} has been failing for 10m.
    - alert: WgfleetClientPathDown
      # client-wg.* rather than client-wg: the check that reports whether the AGENT
      # is carrying the client interface is named client-wg-owned, and a Prometheus
      # regexp is fully anchored, so the narrower pattern excluded it — leaving the
      # one signal for "the client leg is not ours" to fall through to the generic
      # 10-minute warning below.
      expr: wgfleet_node_health_check{check=~"client-wg.*|client-vless"} == 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: 'Client entry point down on {{ $labels.node }}: {{ $labels.check }}'
        description: The client-facing inbound '{{ $labels.check }}' on master {{ $labels.node }} has
          been failing for 5m. New clients cannot connect.
    # wgfleet_agent_egress_reachability and _egress_active are INFO gauges: the
    # agent calls Reset() then Set(1) on the label that is currently true, so the
    # value is always 1 and never 0. Both of these alerted on `== 0` and therefore
    # could not fire — one of them at severity: critical. The state lives in the
    # LABEL, so that is what these match on now.
    # Both of these can only fire on an exit running WARP. EgressClassifier returns
    # no class unless a `warp-egress` health check is present, and ObserveEgress
    # no-ops on an empty one — so an exit with `egress: direct` publishes no
    # reachability series and neither rule can ever fire for it. That is correct for
    # a WARP-reachability probe and misleading as a fleet-wide guarantee: on a
    # direct-egress fleet the critical "your users' traffic is blackholed" signal
    # does not exist, and the dashboard's Egress panel shows No data rather than 0.
    - alert: WgfleetWARPEgressBlocked
      expr: wgfleet_agent_egress_reachability{state="blocked"} == 1
      for: 10m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: WARP egress blocked on exit {{ $labels.node }}
        description: 'Exit {{ $labels.node }} classifies its WARP egress as blocked. Traffic routed to
          this exit is blackholed. Only exits running WARP publish this; an exit on direct egress
          cannot raise it.'
    - alert: WgfleetWARPEgressDegraded
      expr: wgfleet_agent_egress_reachability{state="degraded"} == 1
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: WARP egress degraded on exit {{ $labels.node }}
        description: Exit {{ $labels.node }} has been running on a degraded WARP egress path for 30m.
          Only exits running WARP publish this.
  - name: wgfleet.reconcile
    interval: 30s
    rules:
    - alert: WgfleetReconcileErrors
      # One failed pass out of thirty held this true for the entire 15m window, so
      # the 5m `for:` was met by construction: a single RPC timeout on a flaky link
      # paged, and the agent had already self-healed by the time anyone looked. What
      # matters is not converging — hence the second clause, which is what separates
      # "wobbling but recovering" from "stuck".
      expr: increase(wgfleet_agent_reconcile_total{result!="success"}[30m]) > 5
        and increase(wgfleet_agent_reconcile_total{result="success"}[30m]) == 0
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Agent reconcile errors on {{ $labels.node }}
        description: '{{ $value | printf "%.0f" }} failed reconcile pass(es) in the last 15m on {{ $labels.node
          }} (result={{ $labels.result }}).'
    - alert: WgfleetPersistentDrift
      expr: increase(wgfleet_agent_drift_total[1h]) > 10
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Config drift keeps recurring on {{ $labels.node }}
        description: Component '{{ $labels.exported_component }}' on {{ $labels.node }} drifted {{ $value
          | printf "%.0f" }} times in an hour — something else is fighting the agent for that resource.
    - alert: WgfleetAgentFlapping
      expr: changes(wgfleet_agent_start_time_seconds[1h]) > 3
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: wgfleet-agent restarting repeatedly on {{ $labels.node }}
        description: The agent on {{ $labels.node }} restarted {{ $value | printf "%.0f" }} times in the
          last hour.
  - name: wgfleet.versions
    interval: 1m
    rules:
    - alert: WgfleetWireVersionSkew
      expr: count(count by (wire_version) (wgfleet_node_agent_info)) > 1
      for: 30m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Agents disagree on control-plane wire version
        description: More than one wire_version is live in the fleet for 30m. A rollout is stuck half-applied.
    - alert: WgfleetAgentVersionSkew
      expr: count(count by (agent_version) (wgfleet_node_agent_info)) > 1
      for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Fleet is running mixed agent versions
        description: More than one agent_version has been live for 6h — a rollout was never finished.
  - name: wgfleet.dataplane
    interval: 1m
    rules:
    - alert: WgfleetWireGuardHandshakeStale
      # wg0 is EXCLUDED: it is the client-facing interface, where a stale handshake
      # is a phone in a pocket, not a fault. Left in, this fired once per sleeping
      # device and buried the tunnel peers it exists to watch. Mass client loss is
      # covered by WgfleetNoClientPeers below, which looks at the count instead.
      expr: wgfleet_wg_handshake_age_seconds{iface!="wg0"} > 300
      for: 5m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Stale WireGuard handshake on {{ $labels.node }}/{{ $labels.iface }}
        description: Peer {{ $labels.peer }} on {{ $labels.iface }} ({{ $labels.node }}) last handshook
          {{ $value | humanizeDuration }} ago.
    - alert: WgfleetNoClientPeers
      # The single best signal that end users have lost the fleet: the client
      # interface is up and authenticating nobody. Nothing watched this, so a
      # handover that raised an empty interface — or a client leg that came back
      # without its peers — was visible only as people complaining.
      # The `or` arm is load-bearing. For as long as this rule existed the series
      # it watches was emitted by NOBODY — the collector shelled to `wg show` on
      # nodes that only have `awg` — so the alert could not fire, and its silence
      # read exactly like health. An absent series must be the loudest case here,
      # not the quietest.
      # Split, because the two halves are not the same event. A collector that
      # cannot read the interface is unambiguous and stays critical. Zero peers is
      # NOT: peers_active counts handshakes inside a 3-minute window, so a laptop
      # asleep and a phone with the tunnel off is a genuine, correct zero for hours.
      # As written this paged critical most nights, which is how a channel stops
      # being read. Requiring that the interface HAD peers in the last 6h keeps the
      # collapse case (they were here, now none are) and drops the quiet night.
      expr: (wgfleet_wg_collector_up{iface="wg0"} == 0)
        or (wgfleet_wg_peers_active{iface="wg0"} == 0
            and max_over_time(wgfleet_wg_peers_active{iface="wg0"}[6h]) > 0)
      for: 10m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: No client has a live handshake on {{ $labels.node }}
        description: The client-facing interface on {{ $labels.node }} has had zero active peers for
          10m. Either every client is offline at once, or the interface is serving an empty peer set.
    - alert: WgfleetConfigUnreadable
      # The drift collector emits NOTHING when it cannot read the manifest, on
      # purpose — reporting 0 would assert "in sync" about a file nobody could
      # open. That silence needs its own alert, or a deleted or chmod-broken
      # controller.yaml looks exactly like a healthy one.
      # Watch config_drift, not config_info: the collector emits config_info from
      # the digest it already holds in memory, BEFORE it tries to read the file, so
      # config_info survives exactly the failure this alert is named for. Only
      # config_drift goes absent when the manifest cannot be read.
      expr: absent(wgfleet_controller_config_drift)
      for: 15m
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: The controller is not reporting which manifest it is running
        description: wgfleet_controller_config_info has been absent for 15m — either the controller is
          down, or it cannot read its own manifest and drift detection is blind.
    - alert: WgfleetASBlacklistEmpty
      # Absent is not zero, and the failure this names produces ABSENT. FWCollector
      # emits a per-family series only for sets it actually finds, so a reconciler
      # that stopped creating the set — exactly "abuse filtering is off" — yields
      # silence, and `== 0` could never fire. Measured on the stand: the exit's
      # `inet wgfleet` table exists and carries no blacklist set, and its /metrics has
      # no wgfleet_fw_as_blacklist_size at all. WgfleetNoClientPeers got an `or` arm
      # for precisely this and this rule did not.
      #
      # What this rule can and cannot see, stated plainly rather than implied:
      # it fires when the set EXISTS and is empty. It cannot fire when the set is
      # gone, because distinguishing "the reconciler stopped creating it" from
      # "firewall.as_blacklist is off for this exit" needs a series saying the
      # feature is enabled, and nothing publishes one yet. Until it does, an exit
      # that has lost the set entirely is invisible here.
      expr: wgfleet_fw_as_blacklist_size{family="v4"} == 0
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: AS blacklist is empty on {{ $labels.node }}
        description: The nftables AS blacklist ({{ $labels.family }}) on {{ $labels.node }} exists with 0
          entries — the feed probe is failing and abuse filtering is off.
    - alert: WgfleetNodeCertExpiring
      # Node certificates are issued for a year and the agent renews its own between
      # 70% and 90% of that, in place, over the control plane. So this rule no longer
      # means "the anniversary is near" — it means RENEWAL IS FAILING, and has been
      # for at least 40 days by the time it fires: the node has been offline, or the
      # controller has no CA loaded, or its clock is wrong. 30 days is what is left
      # after the renewal window closes, which is also longer than any holiday.
      expr: (wgfleet_agent_cert_expiry_timestamp_seconds - time()) < 30 * 86400
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: mTLS certificate for {{ $labels.node }} expires in {{ $value | humanizeDuration }}
        description: The control-plane certificate for {{ $labels.node }} expires soon, which means its
          agent has failed to renew it for at least 40 days — check that the node is reachable and that
          the controller has a CA loaded. If it lapses the agent is refused and the node stops
          converging; recover it out of band with `wgfleet-controller --certs renew {{ $labels.node }}`.
    - alert: WgfleetNodeCertExpired
      expr: (wgfleet_agent_cert_expiry_timestamp_seconds - time()) < 0
      for: 5m
      labels:
        severity: critical
        service: wgfleet
      annotations:
        summary: mTLS certificate for {{ $labels.node }} has EXPIRED
        description: '{{ $labels.node }} can no longer authenticate to the controller, so it can no longer
          renew itself either — the renewal RPC needs the handshake the expiry has already closed. It is
          running its last-good configuration until a certificate is installed out of band
          (`wgfleet-controller --certs renew {{ $labels.node }}`, delivered over SSH).'
    - alert: WgfleetProbeStale
      # Guarded against the never-succeeded case: that probe reports a timestamp of 0
      # BY DESIGN, so an unguarded subtraction claims ~56 years of staleness, fires
      # within the hour and pre-empts WgfleetProbeNeverSucceeded, which is the rule
      # that actually describes what happened. README.md carried the correct form all
      # along; both shipped rule files carried the broken one.
      expr: time() - (wgfleet_probe_last_success_timestamp_seconds > 0) > 7 * 86400
      for: 1h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Scheduled probe '{{ $labels.probe }}' stale on {{ $labels.node }}
        description: Probe '{{ $labels.probe }}' on {{ $labels.node }} has not succeeded in over 7 days.
    - alert: WgfleetProbeNeverSucceeded
      expr: wgfleet_probe_last_attempt_timestamp_seconds > 0 unless wgfleet_probe_last_success_timestamp_seconds > 0
      for: 6h
      labels:
        severity: warning
        service: wgfleet
      annotations:
        summary: Scheduled probe '{{ $labels.probe }}' has never succeeded on {{ $labels.node }}
        description: Probe '{{ $labels.probe }}' on {{ $labels.node }} has been attempted but never once
          succeeded.
